<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Viewer — OASIS_OS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1628;overflow:hidden;font-family:'Courier New',monospace;color:#4af}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  #hud h1{font-size:16px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:#4af;text-shadow:0 0 10px #4af6}
  #hud .sub{font-size:11px;color:#4af9;margin-top:4px;letter-spacing:1px}
  #controls{font-size:11px;text-align:right;color:#4af9;line-height:1.7}
  #legend{position:fixed;bottom:16px;left:20px;font-size:11px;line-height:2;pointer-events:none;z-index:10}
  #legend .row{display:flex;align-items:center;gap:8px}
  #legend .swatch{width:22px;height:3px;border-radius:1px;display:inline-block}
  #tooltip{position:fixed;display:none;padding:8px 14px;border:1px solid #4af6;background:#0a1628e6;color:#cde;font-size:12px;pointer-events:none;z-index:20;max-width:320px;line-height:1.5;letter-spacing:.5px}
  #tooltip .label{color:#4af;font-weight:bold;margin-bottom:2px}
  #tooltip .dim{color:#4af9;font-size:11px}
  #explode-slider{position:fixed;bottom:18px;right:20px;z-index:10;display:flex;align-items:center;gap:10px;font-size:11px}
  #explode-slider input{width:120px;accent-color:#4af}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1628;z-index:100;font-size:14px;letter-spacing:2px}
  #dims{position:fixed;top:50px;right:20px;font-size:10px;color:#4af7;pointer-events:none;z-index:10;text-align:right;line-height:1.8;letter-spacing:.5px}
  #tabs{position:fixed;top:48px;left:20px;z-index:10;display:flex;gap:0;flex-wrap:wrap}
  #tabs button{background:none;border:1px solid #4af3;color:#4af9;font-family:'Courier New',monospace;font-size:11px;padding:6px 14px;cursor:pointer;letter-spacing:1px;transition:all .2s}
  #tabs button:first-child{border-radius:3px 0 0 3px}
  #tabs button:last-child{border-radius:0 3px 3px 0}
  #tabs button.active{background:#4af2;color:#4af;border-color:#4af6}
  #tabs button:hover:not(.active){background:#4af1;color:#4af}
  #back-link{position:fixed;top:14px;left:20px;z-index:15;font-size:11px;letter-spacing:1px;pointer-events:auto}
  #back-link a{color:#4af9;text-decoration:none;transition:color .2s}
  #back-link a:hover{color:#4af}
  .state-note{position:fixed;bottom:50px;right:20px;font-size:10px;color:#4af6;pointer-events:none;z-index:10;text-align:right;max-width:200px;line-height:1.6}
</style>
</head>
<body>

<div id="loading">LOADING 3D ENGINE...</div>

<div id="hud">
  <div>
    <h1 id="title">Blueprint Viewer</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div id="controls">
    Left-drag: rotate &bull; Middle-drag: pan &bull; Scroll: zoom<br>
    Hover components for info
  </div>
</div>

<div id="tabs"></div>
<div id="dims"></div>
<div id="legend"></div>
<div id="tooltip"></div>
<div id="back-link"></div>

<div id="explode-slider">
  <span>Compact</span>
  <input type="range" id="explode" min="0" max="100" value="20">
  <span>Exploded</span>
</div>

<div class="state-note" id="state-note"></div>

<script src="js/three.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  DATA-DRIVEN BLUEPRINT VIEWER
//  Reads ?diagram= param, renders from DIAGRAMS config
// ══════════════════════════════════════════════════════════

var DIAGRAMS = {};

// ──────────────────────────────────────────────────────────
//  DIAGRAM: PSP USB Relay (H-Bridge Actuator Control)
// ──────────────────────────────────────────────────────────
DIAGRAMS['psp-relay'] = {
  title: 'PSP Hard Reset Automation',
  subtitle: 'LCUS-2 USB Relay &bull; H-Bridge Wiring &bull; 12V Linear Actuator &bull; CH340 Serial',
  backLink: {href: 'journal/08-remote-dev-automation.html', text: '&larr; Entry 08: Zero-Touch PSP Development'},
  dims: 'USB relay: 50x26mm PCB\nActuator: 10mm stroke, 188N\n12V 2A power supply\nCH340 serial control',
  legend: [
    {color:'#f44', label:'12V power (from adapter)'},
    {color:'#4af', label:'USB data (to desktop PC)'},
    {color:'#4f4', label:'Relay coil control signal'},
    {color:'#fa0', label:'Motor wiring (H-bridge)'},
    {color:'#c4f', label:'Screw terminal connections'}
  ],
  camera: {r:38, phi:Math.PI/3.2, theta:Math.PI/4.5, target:[0,5,0]},
  stateNotes: [
    'Both OFF: extend (push slider)',
    'Both ON: retract (release)',
    'Mixed: motor stopped'
  ],
  tabs: [
    {id:'both-off', label:'BOTH OFF (EXTEND)'},
    {id:'both-on', label:'BOTH ON (RETRACT)'},
    {id:'mixed', label:'MIXED (STOP)'}
  ],
  build: function(scene, S, helpers){
    var G = {};
    var groups = ['psu','usb','relay','actuator','wires','dims'];
    groups.forEach(function(k){ G[k]=new THREE.Group(); scene.add(G[k]); });

    // ── 12V Power Supply ────────────────────────────
    var psuBox = helpers.wireBox(8,3,5, helpers.lm(0xffaa22), helpers.fm(0x2a1a05,0.35));
    psuBox.position.set(-14, 1.5, -6);
    G.psu.add(psuBox);
    // DC barrel jack
    var barrel = helpers.cyl(0.6, 1.5, 8, helpers.lm(0x888888));
    barrel.position.set(-14, 1.5, -3.3);
    barrel.rotation.x = Math.PI/2;
    G.psu.add(barrel);
    // Screw terminals
    var st1 = helpers.wireBox(1.2,1,1, helpers.lm(0x44cc44));
    st1.position.set(-12.5, 3.2, -6);
    G.psu.add(st1);
    var st2 = helpers.wireBox(1.2,1,1, helpers.lm(0x44cc44));
    st2.position.set(-15.5, 3.2, -6);
    G.psu.add(st2);
    G.psu.add(helpers.tag('12V 2A ADAPTER',new THREE.Vector3(-14, 5, -6),'#ffaa22', new THREE.Vector3(-14, 3, -6)));
    G.psu.add(helpers.tag('Screw terminal end',new THREE.Vector3(-14, 4.2, -6),'#886622'));

    // ── Desktop PC / USB connection ─────────────────
    var pcBox = helpers.wireBox(8,5,5, helpers.lm(0x4488ff), helpers.fm(0x0a1840,0.25));
    pcBox.position.set(14, 2.5, -6);
    G.usb.add(pcBox);
    // USB port
    var usbPort = helpers.wireBox(1.2,0.5,0.8, helpers.lm(0x4488ff));
    usbPort.position.set(11.5, 2, -6);
    G.usb.add(usbPort);
    G.usb.add(helpers.tag('USB -> DESKTOP PC',new THREE.Vector3(14, 6, -6),'#4488ff', new THREE.Vector3(14, 5, -6)));
    G.usb.add(helpers.tag('CH340 serial control',new THREE.Vector3(14, 5.2, -6),'#2255aa'));

    // ── LCUS-2 USB Relay Module ─────────────────────
    // Main PCB
    var relayPCB = helpers.wireBox(12, 0.8, 7, helpers.lm(0x22aa66), helpers.fm(0x0a2818,0.3));
    relayPCB.position.set(0, 4, 0);
    G.relay.add(relayPCB);

    // Micro-USB connector
    var microUSB = helpers.wireBox(1.2, 0.6, 0.8, helpers.lm(0x888888));
    microUSB.position.set(-5, 4.5, -3.2);
    G.relay.add(microUSB);

    // Relay 1 (blue cube)
    var relay1 = helpers.wireBox(4, 3.5, 4, helpers.lm(0x4488cc), helpers.fm(0x112840,0.4));
    relay1.position.set(-2.5, 6.5, 0.5);
    G.relay.add(relay1);
    G.relay.add(helpers.tag('RELAY 1',new THREE.Vector3(-2.5, 9, 0.5),'#4488cc', new THREE.Vector3(-2.5, 8.2, 0.5)));

    // Relay 2 (blue cube)
    var relay2 = helpers.wireBox(4, 3.5, 4, helpers.lm(0x4488cc), helpers.fm(0x112840,0.4));
    relay2.position.set(3.5, 6.5, 0.5);
    G.relay.add(relay2);
    G.relay.add(helpers.tag('RELAY 2',new THREE.Vector3(3.5, 9, 0.5),'#4488cc', new THREE.Vector3(3.5, 8.2, 0.5)));

    // Terminal blocks (green, 3 per relay)
    // Relay 1: NC, COM, NO
    ['NC','COM','NO'].forEach(function(label, i){
      var term = helpers.wireBox(1.2, 1.5, 1.2, helpers.lm(0x44cc88));
      term.position.set(-4.5 + i*2, 4, 3.8);
      G.relay.add(term);
      G.relay.add(helpers.tag(label, new THREE.Vector3(-4.5+i*2, 3, 4.8),'#44cc88'));
    });
    // Relay 2: NO, NC, COM
    ['NO','NC','COM'].forEach(function(label, i){
      var term = helpers.wireBox(1.2, 1.5, 1.2, helpers.lm(0x44cc88));
      term.position.set(1.5 + i*2, 4, 3.8);
      G.relay.add(term);
      G.relay.add(helpers.tag(label, new THREE.Vector3(1.5+i*2, 3, 4.8),'#44cc88'));
    });

    // Status LEDs
    var led1 = helpers.wireBox(0.3, 0.3, 0.3, helpers.lm(0xff4444), helpers.fm(0xff2222,0.5));
    led1.position.set(-2.5, 4.6, -2);
    G.relay.add(led1);
    var led2 = helpers.wireBox(0.3, 0.3, 0.3, helpers.lm(0xff4444), helpers.fm(0xff2222,0.5));
    led2.position.set(3.5, 4.6, -2);
    G.relay.add(led2);

    G.relay.add(helpers.tag('2-CH LCUS USB RELAY',new THREE.Vector3(0, 10.5, 0),'#22aa66', new THREE.Vector3(0, 8, 0)));
    G.relay.add(helpers.tag('CH340 serial control',new THREE.Vector3(0, 9.7, 0),'#117744'));

    // ── JQDML Actuator ──────────────────────────────
    // Actuator body
    var actBody = helpers.wireBox(3, 3, 8, helpers.lm(0xcc8844), helpers.fm(0x2a1a05,0.35));
    actBody.position.set(0, 1.5, 14);
    G.actuator.add(actBody);
    // Actuator shaft
    var shaft = helpers.wireBox(0.8, 0.8, 3, helpers.lm(0xcccccc));
    shaft.position.set(0, 1.5, 18.5);
    G.actuator.add(shaft);
    // Motor wires (two coming out back)
    var wireR = helpers.wireBox(0.15, 0.15, 1.5, helpers.lm(0xff4444));
    wireR.position.set(-0.5, 2, 9.5);
    G.actuator.add(wireR);
    var wireB = helpers.wireBox(0.15, 0.15, 1.5, helpers.lm(0x222222));
    wireB.position.set(0.5, 2, 9.5);
    G.actuator.add(wireB);

    G.actuator.add(helpers.tag('JQDML ACTUATOR',new THREE.Vector3(0, 5, 14),'#cc8844', new THREE.Vector3(0, 3, 14)));
    G.actuator.add(helpers.tag('Pushes PSP power slider',new THREE.Vector3(0, 4.2, 14),'#886622'));
    G.actuator.add(helpers.tag('10mm stroke, 188N',new THREE.Vector3(0, 3.4, 14),'#664411'));

    // ── Wires ───────────────────────────────────────
    // 12V+ from PSU to relay (red, dashed-style)
    // 12V+ goes to NC terminal of relay 1
    G.wires.add(helpers.cable([
      new THREE.Vector3(-12.5, 3.5, -6),
      new THREE.Vector3(-12.5, 4, -3),
      new THREE.Vector3(-4.5, 4, 3.8)
    ], helpers.lm(0xff4444)));
    G.wires.add(helpers.tag('12V+',new THREE.Vector3(-9, 5, -2),'#ff4444'));

    // GND from PSU to NC terminal of relay 2
    G.wires.add(helpers.cable([
      new THREE.Vector3(-15.5, 3.5, -6),
      new THREE.Vector3(-15.5, 4, -3),
      new THREE.Vector3(-15.5, 2, 2),
      new THREE.Vector3(3.5, 2, 2),
      new THREE.Vector3(3.5, 4, 3.8)
    ], helpers.lm(0x888888)));
    G.wires.add(helpers.tag('GND',new THREE.Vector3(-15.5, 5, -3),'#888888'));

    // 12V+ also crosses to NO of relay 2 (H-bridge cross wire)
    G.wires.add(helpers.cable([
      new THREE.Vector3(-4.5, 3.5, 3.8),
      new THREE.Vector3(-4.5, 2, 5),
      new THREE.Vector3(1.5, 2, 5),
      new THREE.Vector3(1.5, 3.5, 3.8)
    ], helpers.lm(0xff4444)));

    // GND also crosses to NO of relay 1 (H-bridge cross wire)
    G.wires.add(helpers.cable([
      new THREE.Vector3(3.5, 3.5, 3.8),
      new THREE.Vector3(3.5, 1.5, 5.5),
      new THREE.Vector3(-0.5, 1.5, 5.5),
      new THREE.Vector3(-0.5, 3.5, 3.8)
    ], helpers.lm(0x888888)));

    // COM1 -> actuator red wire
    G.wires.add(helpers.cable([
      new THREE.Vector3(-2.5, 4, 3.8),
      new THREE.Vector3(-2.5, 4, 6),
      new THREE.Vector3(-0.5, 3, 8.5),
      new THREE.Vector3(-0.5, 2, 9.5)
    ], helpers.lm(0xffaa00)));
    G.wires.add(helpers.tag('Red wire',new THREE.Vector3(-3.5, 4.5, 7),'#ffaa00'));

    // COM2 -> actuator black wire
    G.wires.add(helpers.cable([
      new THREE.Vector3(5.5, 4, 3.8),
      new THREE.Vector3(5.5, 4, 6),
      new THREE.Vector3(0.5, 3, 8.5),
      new THREE.Vector3(0.5, 2, 9.5)
    ], helpers.lm(0xffaa00)));
    G.wires.add(helpers.tag('Black wire',new THREE.Vector3(6.5, 4.5, 7),'#ffaa00'));

    // USB cable from PC to relay
    G.wires.add(helpers.cable([
      new THREE.Vector3(11.5, 2, -6),
      new THREE.Vector3(8, 2, -6),
      new THREE.Vector3(2, 3, -4),
      new THREE.Vector3(-5, 4.5, -3.2)
    ], helpers.lm(0x4488ff)));
    G.wires.add(helpers.tag('USB (Micro-B)',new THREE.Vector3(6, 3, -5),'#4488ff'));

    // ── Dimension annotations ───────────────────────
    G.dims.add(helpers.dimLine(
      new THREE.Vector3(-6, 0, -4),
      new THREE.Vector3(6, 0, -4),
      '~50mm relay PCB'
    ));

    return {
      groups: G,
      explodeSmallY: {psu:0, usb:0, relay:3, actuator:-2, wires:0, dims:0},
      explodeGrid: {
        psu:{x:-18,y:0,z:-12}, usb:{x:18,y:0,z:-12},
        relay:{x:0,y:0,z:0}, actuator:{x:0,y:0,z:18},
        wires:{x:0,y:0,z:0}, dims:{x:0,y:0,z:0}
      },
      hoverData: [
        {group:G.psu, label:'12V 2A DC Adapter', desc:'Standard 12V 2A power supply with screw terminal end. Powers the actuator through the relay H-bridge. No soldering required — bare wire into screw terminals.<br><span class="dim">~$8, any polarity-marked adapter works</span>'},
        {group:G.usb, label:'Desktop PC (USB Host)', desc:'Sends serial commands to the CH340 chip on the relay module. Python script toggles relay channels to control actuator direction.<br><span class="dim">python psp_actuator.py on/off</span>'},
        {group:G.relay, label:'2-Channel LCUS USB Relay', desc:'LCUS-2 module with CH340 USB-serial chip. Two SPDT relays wired as H-bridge — cross-wiring NC/NO terminals reverses motor polarity. Status LEDs show relay state.<br><span class="dim">50x26mm PCB, ~$12, Micro-USB power+data</span>'},
        {group:G.actuator, label:'JQDML Linear Actuator', desc:'12V mini linear actuator, 10mm stroke, 188N force. Pushes the PSP power slider to toggle power. H-bridge control: both OFF=extend, both ON=retract, mixed=stop.<br><span class="dim">~$15, attaches to PSP with 3D-printed bracket</span>'},
        {group:G.wires, label:'H-Bridge Wiring', desc:'Cross-wired relay outputs form an H-bridge. 12V+ connects to relay 1 NC and relay 2 NO. GND connects to relay 1 NO and relay 2 NC. COM terminals connect to actuator motor leads. Polarity reversal drives extend/retract.<br><span class="dim">22 AWG hookup wire + Wago 221 lever connectors</span>'}
      ],
      // Tab-specific state (relay positions for visualization)
      tabStates: {
        'both-off': {led1: false, led2: false, note: 'Both relays OFF: NC contacts closed\n12V+ -> red wire, GND -> black wire\nActuator EXTENDS (pushes slider)'},
        'both-on': {led1: true, led2: true, note: 'Both relays ON: NO contacts closed\nGND -> red wire, 12V+ -> black wire\nActuator RETRACTS (releases slider)'},
        'mixed': {led1: true, led2: false, note: 'One ON, one OFF: same voltage on both wires\nMotor STOPPED (braking)'}
      }
    };
  }
};

// ──────────────────────────────────────────────────────────
//  DIAGRAM: PSP USB-C Adapter (Passive Bridge)
// ──────────────────────────────────────────────────────────
DIAGRAMS['psp-usb-adapter'] = {
  title: 'PSP Universal USB-C Adapter',
  subtitle: 'Passive Bridge &bull; Power Pads + Mini-B Data &bull; Single USB-C Receptacle',
  backLink: {href: 'journal/05-psp-usb-research.html', text: '&larr; Entry 05: PSP USB Research'},
  dims: 'PSP top edge: ~82mm wide\nMini-B port: 8x4mm\nPower pads: ~3x5mm each\nUSB-C receptacle: 8.3x2.5mm',
  legend: [
    {color:'#fa0', label:'VBUS (5V from power pads)'},
    {color:'#c4f', label:'D+/D- (Mini-B passthru)'},
    {color:'#888', label:'Mechanical (screws, pogo pins)'},
    {color:'#4f4', label:'CC pulldown resistors (5.1k)'},
    {color:'#4af', label:'USB-C receptacle'}
  ],
  camera: {r:22, phi:Math.PI/2.8, theta:Math.PI/12, target:[0,6,0]},
  tabs: [
    {id:'assembled', label:'ASSEMBLED'},
    {id:'exploded', label:'EXPLODED VIEW'}
  ],
  build: function(scene, S, helpers){
    var G = {};
    var groups = ['psp','adapter','usbc_device','wires','dims'];
    groups.forEach(function(k){ G[k]=new THREE.Group(); scene.add(G[k]); });

    // ── PSP Body (PSP-3001, standing upright) ───────
    // Real dims: 169.4 x 71.4 x 18.6mm
    // Standing upright: X=width(169.4), Y=height(71.4), Z=depth(18.6)
    // Scale: 1 unit = ~10mm
    var pW = 17, pH = 7.14, pD = 1.86; // width, height, depth
    var pCY = pH/2; // center Y (bottom at Y=0)

    // Main body
    var pspBody = helpers.wireBox(pW, pH, pD, helpers.lm(0x333344), helpers.fm(0x0e0e18,0.3));
    pspBody.position.set(0, pCY, 0);
    G.psp.add(pspBody);

    // Left grip (d-pad side, -X)
    var gripL = helpers.wireBox(3.5, pH-1, pD+0.4, helpers.lm(0x2a2a3a), helpers.fm(0x0e0e18,0.15));
    gripL.position.set(-7.5, pCY-0.3, 0);
    G.psp.add(gripL);
    // Right grip (face buttons side, +X)
    var gripR = helpers.wireBox(3.5, pH-1, pD+0.4, helpers.lm(0x2a2a3a), helpers.fm(0x0e0e18,0.15));
    gripR.position.set(7.5, pCY-0.3, 0);
    G.psp.add(gripR);

    // Screen bezel (on front face, Z = pD/2)
    var bzW = 11, bzH = 5.2;
    var faceZ = pD/2 + 0.02; // just in front of body
    var bezel = helpers.wireBox(bzW, bzH, 0.15, helpers.lm(0x222233), helpers.fm(0x060610,0.4));
    bezel.position.set(0, pCY+0.2, faceZ);
    G.psp.add(bezel);

    // LCD screen (480x272 → ~95x54mm active area)
    var scrW = 9.5, scrH = 4.5;
    var screenGeo = new THREE.PlaneGeometry(scrW, scrH);
    var screenMesh = new THREE.Mesh(screenGeo, helpers.fm(0x112844, 0.5));
    screenMesh.position.set(0, pCY+0.2, faceZ+0.02);
    G.psp.add(screenMesh);
    var screenBorder = new THREE.LineSegments(new THREE.EdgesGeometry(screenGeo), helpers.lm(0x224466));
    screenBorder.position.copy(screenMesh.position);
    G.psp.add(screenBorder);

    // Scan lines on screen (subtle)
    for(var sl=0; sl<8; sl++){
      var scanLine = new THREE.Mesh(
        new THREE.PlaneGeometry(scrW-0.2, 0.02),
        helpers.fm(0x44aaff, 0.08)
      );
      scanLine.position.set(0, pCY+0.2-scrH/2+0.3+sl*(scrH/8), faceZ+0.03);
      G.psp.add(scanLine);
    }

    // D-pad (left side, on front face)
    var dpadRing = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.RingGeometry(0.6, 0.8, 16)),
      helpers.lm(0x444455)
    );
    dpadRing.position.set(-7, pCY, faceZ+0.02);
    G.psp.add(dpadRing);
    // D-pad cross
    [[0,0.55,0,-0.55],[0.55,0,-0.55,0]].forEach(function(c){
      G.psp.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-7+c[0], pCY+c[1], faceZ+0.03),
          new THREE.Vector3(-7+c[2], pCY+c[3], faceZ+0.03)
        ]), helpers.lm(0x444455)));
    });

    // Face buttons (right side) — triangle, circle, cross, square
    var btnOff = [[0,0.6],[0.6,0],[0,-0.6],[-0.6,0]];
    var btnCol = [0x55aa77, 0xff5566, 0x5566cc, 0xcc55aa];
    btnOff.forEach(function(off, i){
      var btn = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.RingGeometry(0.2, 0.3, 10)),
        helpers.lm(btnCol[i])
      );
      btn.position.set(7+off[0], pCY+off[1], faceZ+0.02);
      G.psp.add(btn);
    });

    // Analog nub (below-left of screen)
    var analogNub = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.CircleGeometry(0.4, 12)),
      helpers.lm(0x555566)
    );
    analogNub.position.set(-5, pCY-2, faceZ+0.02);
    G.psp.add(analogNub);

    // Speaker grilles (either side of screen)
    [-5.8, 5.8].forEach(function(x){
      for(var r=0; r<3; r++){
        for(var c2=0; c2<2; c2++){
          var dot = new THREE.Mesh(new THREE.CircleGeometry(0.06, 6), helpers.fm(0x222233, 0.6));
          dot.position.set(x+c2*0.25, pCY+0.8-r*0.25, faceZ+0.02);
          G.psp.add(dot);
        }
      }
    });

    // Shoulder buttons L/R (on top edge)
    var topY = pH; // top of PSP
    var shoulderL = helpers.wireBox(2.5, 0.5, pD-0.3, helpers.lm(0x444455));
    shoulderL.position.set(-6.5, topY, 0);
    G.psp.add(shoulderL);
    var shoulderR = helpers.wireBox(2.5, 0.5, pD-0.3, helpers.lm(0x444455));
    shoulderR.position.set(6.5, topY, 0);
    G.psp.add(shoulderR);

    // Power slider (far left, top edge)
    var pwrSlider = helpers.wireBox(1.5, 0.3, 0.4, helpers.lm(0x556655));
    pwrSlider.position.set(-8.2, topY, 0);
    G.psp.add(pwrSlider);

    // SONY logo
    G.psp.add(helpers.tag('SONY', new THREE.Vector3(7, pCY-2.5, faceZ+0.1), '#333344'));

    // Bottom bar labels: HOME VOL PSP SELECT START
    var barLabels = ['HOME','VOL','','SELECT','START'];
    var barX = [-6.5, -4, 0, 4, 6.5];
    barLabels.forEach(function(l,i){
      if(!l) return;
      G.psp.add(helpers.tag(l, new THREE.Vector3(barX[i], 0.3, faceZ+0.1), '#333344'));
    });

    // PSP logo (center bottom, below screen)
    G.psp.add(helpers.tag('PSP', new THREE.Vector3(0, 0.3, faceZ+0.1), '#334455'));

    // ── Top edge: USB port + power pads ─────────────
    // Top edge is at Y = pH, facing +Y
    var teY = topY; // top edge Y

    // Mini-B port (center of top edge)
    var miniB = helpers.wireBox(1.2, 0.6, 0.8, helpers.lm(0xcc44ff));
    miniB.position.set(0, teY+0.3, 0);
    G.psp.add(miniB);
    G.psp.add(helpers.tag('Mini-B USB',new THREE.Vector3(0, teY-0.5, -pD/2-1.5),'#cc44ff', new THREE.Vector3(0, teY+0.3, 0)));

    // Power pads flanking the port
    var padSpec = [
      {x:-4, color:0xffaa00, label:'5V'},
      {x:-2.5, color:0x888888, label:'GND'},
      {x:2.5, color:0x888888, label:'GND'},
      {x:4, color:0xffaa00, label:'5V'}
    ];
    padSpec.forEach(function(p){
      var pad = helpers.wireBox(0.6, 0.2, 0.5, helpers.lm(p.color), helpers.fm(p.color,0.5));
      pad.position.set(p.x, teY+0.1, 0);
      G.psp.add(pad);
      G.psp.add(helpers.tag(p.label, new THREE.Vector3(p.x, teY+0.8, 0),
        p.color===0xffaa00?'#ffaa00':'#888888'));
    });

    G.psp.add(helpers.tag('PSP-3001',new THREE.Vector3(-pW/2-2, pCY, 0),'#556677', new THREE.Vector3(-pW/2, pCY, 0)));
    G.psp.add(helpers.tag('169.4 x 71.4 x 18.6mm',new THREE.Vector3(-pW/2-2, pCY-0.7, 0),'#334455'));

    // ── Adapter (compact box centered on USB port, like TV tuner) ──
    // Real adapter ~50mm wide x 30mm tall x 20mm deep
    // In scene units: 5 x 3 x 2
    var aW = 5, aH = 3, aD = pD+1;
    var aBot = teY + 0.15; // sits right on top of PSP
    var aCY = aBot + aH/2;

    // Outer shell
    var shell = helpers.wireBox(aW, aH, aD, helpers.lm(0x667788), helpers.fm(0x112233,0.15));
    shell.position.set(0, aCY, 0);
    G.adapter.add(shell);

    // Carrier PCB (horizontal inside shell)
    var pcb = helpers.wireBox(aW-1, 0.3, pD-0.3, helpers.lm(0x22aa66), helpers.fm(0x0a2818,0.4));
    pcb.position.set(0, aCY+0.3, 0);
    G.adapter.add(pcb);

    // USB-C receptacle (top of adapter, facing up)
    var usbcPort = helpers.wireBox(1.2, 0.5, 0.8, helpers.lm(0x4488ff), helpers.fm(0x112840,0.5));
    usbcPort.position.set(0, aBot+aH, 0);
    G.adapter.add(usbcPort);

    // CC pulldown resistors on PCB (tiny)
    [-0.8, 0.8].forEach(function(x){
      var r = helpers.wireBox(0.2, 0.15, 0.15, helpers.lm(0x44ff44), helpers.fm(0x22aa22,0.5));
      r.position.set(x, aCY+0.5, 0);
      G.adapter.add(r);
    });

    // Pogo pins (extend down from adapter bottom to PSP pads)
    // Only 4 pins spanning the pad area (+-4 and +-2.5 on PSP)
    // But adapter is only 5 wide, so pins at edges of adapter
    [-1.8, -1, 1, 1.8].forEach(function(x){
      var pogo = helpers.wireBox(0.15, 0.6, 0.15, helpers.lm(0xccaa00));
      pogo.position.set(x, aBot-0.15, 0);
      G.adapter.add(pogo);
    });

    // Mini-B male plug (center, extends down into PSP port)
    var miniBPlug = helpers.wireBox(0.8, 0.6, 0.5, helpers.lm(0xcc44ff));
    miniBPlug.position.set(0, aBot-0.15, 0);
    G.adapter.add(miniBPlug);

    // Screw mounts (two small posts on sides)
    [-aW/2-0.3, aW/2+0.3].forEach(function(x){
      var screw = helpers.cyl(0.2, aH+0.5, 6, helpers.lm(0x888888));
      screw.position.set(x, aCY-0.2, 0);
      G.adapter.add(screw);
    });

    // Labels — compact, positioned near adapter
    G.adapter.add(helpers.tag('ADAPTER SHELL',new THREE.Vector3(aW/2+1.5, aCY+1, 0),'#667788', new THREE.Vector3(aW/2, aCY, 0)));
    G.adapter.add(helpers.tag('Passive carrier PCB',new THREE.Vector3(aW/2+1.5, aCY+0.3, 0),'#22aa66', new THREE.Vector3(aW/2-0.5, aCY+0.3, 0)));
    G.adapter.add(helpers.tag('USB-C receptacle',new THREE.Vector3(aW/2+1.5, aBot+aH+0.3, 0),'#4488ff', new THREE.Vector3(0.8, aBot+aH, 0)));
    G.adapter.add(helpers.tag('5.1k CC pulldowns',new THREE.Vector3(aW/2+1.5, aCY+0.5, 0),'#44ff44'));
    G.adapter.add(helpers.tag('Pogo pins (5V)',new THREE.Vector3(-aW/2-1.5, aBot-0.2, 0),'#ccaa00', new THREE.Vector3(-1.8, aBot-0.15, 0)));
    G.adapter.add(helpers.tag('Mini-B male',new THREE.Vector3(-aW/2-1.5, aBot-0.8, 0),'#cc44ff', new THREE.Vector3(-0.5, aBot-0.15, 0)));
    G.adapter.add(helpers.tag('Screw mount',new THREE.Vector3(-aW/2-1.5, aCY, 0),'#888888', new THREE.Vector3(-aW/2-0.3, aCY, 0)));

    // ── External USB-C Device ───────────────────────
    var dY = aBot+aH+0.3; // just above adapter top
    var devBox = helpers.wireBox(4, 2.5, 3, helpers.lm(0x44aaff), helpers.fm(0x112840,0.25));
    devBox.position.set(0, dY+2.5, 0);
    G.usbc_device.add(devBox);
    // USB-C plug going down
    var usbcPlug = helpers.wireBox(0.5, 1, 0.3, helpers.lm(0x888888));
    usbcPlug.position.set(0, dY+0.7, 0);
    G.usbc_device.add(usbcPlug);
    G.usbc_device.add(helpers.tag('ANY USB-C DEVICE',new THREE.Vector3(0, dY+4.2, 0),'#44aaff', new THREE.Vector3(0, dY+3.8, 0)));
    G.usbc_device.add(helpers.tag('Luckfox, Pi Zero, etc.',new THREE.Vector3(0, dY+3.5, 0),'#2266aa'));
    G.usbc_device.add(helpers.tag('USB-C plug',new THREE.Vector3(-3, dY+0.7, 0),'#888888', new THREE.Vector3(-0.4, dY+0.7, 0)));

    // ── Signal Traces ───────────────────────────────
    // VBUS: power pads → pogo pins → PCB → USB-C
    // Traces run from the wide pad positions inward to the compact adapter
    [-4, 4].forEach(function(x){
      G.wires.add(helpers.cable([
        new THREE.Vector3(x, teY+0.2, 0),
        new THREE.Vector3(x, teY+0.5, 0),
        new THREE.Vector3(x*0.4, aBot, 0),
        new THREE.Vector3(x*0.15, aCY+0.3, 0),
        new THREE.Vector3(x*0.1, aBot+aH, 0)
      ], helpers.lm(0xffaa00)));
    });
    // D+/D-: Mini-B → adapter → USB-C data
    [-0.2, 0.2].forEach(function(x){
      G.wires.add(helpers.cable([
        new THREE.Vector3(x, teY+0.4, 0),
        new THREE.Vector3(x, aCY, 0),
        new THREE.Vector3(x, aBot+aH, 0)
      ], helpers.lm(0xcc44ff)));
    });

    // ── Dimension annotations ───────────────────────
    G.dims.add(helpers.dimLine(
      new THREE.Vector3(-pW/2, -0.5, pD/2+1.5),
      new THREE.Vector3(pW/2, -0.5, pD/2+1.5),
      '169.4mm'
    ));
    G.dims.add(helpers.dimLine(
      new THREE.Vector3(pW/2+1.5, 0, pD/2+1.5),
      new THREE.Vector3(pW/2+1.5, pH, pD/2+1.5),
      '71.4mm'
    ));

    return {
      groups: G,
      explodeSmallY: {psp:-4, adapter:3, usbc_device:8, wires:0, dims:0},
      explodeGrid: {
        psp:{x:0,y:-8,z:0}, adapter:{x:0,y:0,z:0},
        usbc_device:{x:0,y:10,z:0}, wires:{x:0,y:0,z:0}, dims:{x:0,y:0,z:0}
      },
      hoverData: [
        {group:G.psp, label:'PSP Body (Top Edge)', desc:'PSP-2000/3000 top edge with Mini-B USB port (data only) and proprietary side contact pads. The 5V and GND pads flank the Mini-B port on both sides — discovered through Go!Cam teardown.<br><span class="dim">Sony never drove 5V on VBUS — accessories use these pads</span>'},
        {group:G.adapter, label:'Passive Carrier Adapter', desc:'Clip-on module that bridges PSP proprietary connectors to standard USB-C. Pogo pins contact power pads, Mini-B male passes through data. Carrier PCB routes both to a single USB-C receptacle with 5.1k CC pulldowns.<br><span class="dim">~$7-11 per unit, no active components, ENIG finish</span>'},
        {group:G.usbc_device, label:'Any USB-C Device', desc:'The adapter accepts any standard USB-C device — Luckfox Pico, Raspberry Pi Zero, or any SBC. The device acts as USB host, the PSP as USB device. Power comes from PSP\'s side pads, data from Mini-B passthrough.<br><span class="dim">Custom sceUsbbd driver on PSP: ~100 FPS / 28 MB/s bulk transfer</span>'},
        {group:G.wires, label:'Signal Routing', desc:'VBUS: 5V from left+right power pads routed to USB-C VBUS pin. D+/D-: Mini-B data lines passed through to USB-C data pins. CC1/CC2: 5.1k pulldowns to GND for USB-C device identification.<br><span class="dim">All passive — no level shifters or active components needed</span>'}
      ],
      tabStates: {
        'assembled': {note: 'Assembled view: adapter clipped onto PSP\nPogo pins contact power pads\nMini-B plug inserted for data'},
        'exploded': {note: 'Exploded view: PSP, adapter, and\nexternal device separated for clarity'}
      }
    };
  }
};

// ══════════════════════════════════════════════════════════
//  ENGINE: Initialize and render selected diagram
// ══════════════════════════════════════════════════════════
window.addEventListener('load', function(){

document.getElementById('loading').style.display = 'none';

// Parse URL params
var params = new URLSearchParams(window.location.search);
var diagramId = params.get('diagram') || Object.keys(DIAGRAMS)[0];
var diagram = DIAGRAMS[diagramId];
if(!diagram){
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading').textContent = 'UNKNOWN DIAGRAM: ' + diagramId;
  return;
}

// Populate HUD
document.getElementById('title').textContent = diagram.title;
document.getElementById('subtitle').innerHTML = diagram.subtitle;
if(diagram.dims) document.getElementById('dims').innerHTML = diagram.dims.replace(/\n/g,'<br>');
if(diagram.backLink){
  document.getElementById('back-link').innerHTML = '<a href="'+diagram.backLink.href+'">'+diagram.backLink.text+'</a>';
}

// Legend
var legendEl = document.getElementById('legend');
if(diagram.legend){
  legendEl.innerHTML = diagram.legend.map(function(l){
    return '<div class="row"><span class="swatch" style="background:'+l.color+'"></span> '+l.label+'</div>';
  }).join('');
}

// State notes
if(diagram.stateNotes){
  document.getElementById('state-note').innerHTML = diagram.stateNotes.join('<br>');
}

// ── Scene ────────────────────────────────────────────
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1628, 0.008);

var cam = diagram.camera || {r:35, phi:Math.PI/3.5, theta:Math.PI/5, target:[0,5,0]};
var camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 500);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0a1628);
document.body.appendChild(renderer.domElement);

// ── Orbit controls ───────────────────────────────────
window.orbit = {
  drag:false, px:0, py:0, mode:null,
  r:cam.r, phi:cam.phi, theta:cam.theta,
  target: new THREE.Vector3(cam.target[0], cam.target[1], cam.target[2])
};
var orbit = window.orbit;

window.camUpdate = function(){
  orbit.phi = Math.max(0.1, Math.min(Math.PI-0.1, orbit.phi));
  orbit.r = Math.max(5, Math.min(90, orbit.r));
  camera.position.set(
    orbit.target.x + orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta),
    orbit.target.y + orbit.r*Math.cos(orbit.phi),
    orbit.target.z + orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
};
var camUpdate = window.camUpdate;
camUpdate();

renderer.domElement.addEventListener('pointerdown',function(e){
  orbit.px=e.clientX; orbit.py=e.clientY;
  if(e.button===0) orbit.mode='rotate';
  else if(e.button===1){orbit.mode='pan'; e.preventDefault();}
  orbit.drag=true;
});
renderer.domElement.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('pointerup',function(){orbit.drag=false; orbit.mode=null;});
window.addEventListener('pointermove',function(e){
  if(!orbit.drag) return;
  var dx=e.clientX-orbit.px, dy=e.clientY-orbit.py;
  orbit.px=e.clientX; orbit.py=e.clientY;
  if(orbit.mode==='rotate'){
    orbit.theta -= dx*0.008;
    orbit.phi -= dy*0.008;
  } else if(orbit.mode==='pan'){
    var panSpeed = orbit.r*0.002;
    var forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    var right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
    var up = new THREE.Vector3().crossVectors(right, forward).normalize();
    orbit.target.add(right.multiplyScalar(-dx*panSpeed));
    orbit.target.add(up.multiplyScalar(dy*panSpeed));
  }
  camUpdate();
});
renderer.domElement.addEventListener('wheel',function(e){orbit.r+=e.deltaY*0.03;camUpdate();},{passive:true});
renderer.domElement.addEventListener('mousedown',function(e){if(e.button===1)e.preventDefault();});

// ── Helpers ──────────────────────────────────────────
function lm(c){return new THREE.LineBasicMaterial({color:c});}
function fm(c,op){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op||0.35,side:THREE.DoubleSide});}

function wireBox(w,h,d,lineMat,fillMat){
  var g = new THREE.Group();
  var geo = new THREE.BoxGeometry(w,h,d);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat));
  if(fillMat) g.add(new THREE.Mesh(geo, fillMat));
  return g;
}
function cylHelper(r,h,segs,material){
  var geo = new THREE.CylinderGeometry(r,r,h,segs);
  return new THREE.LineSegments(new THREE.EdgesGeometry(geo), material);
}
function cableHelper(pts, material){
  var curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.35);
  var geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(50));
  return new THREE.Line(geo, material);
}
function tagHelper(text, pos, color, target){
  var g = new THREE.Group();
  var c = document.createElement('canvas'); c.width=512; c.height=64;
  var ctx = c.getContext('2d');
  ctx.font = 'bold 22px Courier New';
  ctx.fillStyle = color || '#4488cc';
  ctx.fillText(text, 6, 36);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.scale.set(6.5, 0.85, 1);
  sp.position.copy(pos);
  g.add(sp);
  if(target){
    var lineGeo = new THREE.BufferGeometry().setFromPoints([pos, target]);
    var lineCol = parseInt((color||'#4488cc').replace('#',''),16);
    g.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color:lineCol, transparent:true, opacity:0.4})));
    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,4), new THREE.MeshBasicMaterial({color:lineCol}));
    dot.position.copy(target);
    g.add(dot);
  }
  return g;
}
function dimLineHelper(p1,p2,label,col){
  var g = new THREE.Group();
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]), lm(col||0x1e3a55)));
  var mid = p1.clone().add(p2).multiplyScalar(0.5); mid.y += 0.4;
  g.add(tagHelper(label, mid, col?('#'+col.toString(16).padStart(6,'0')):'#2a5588'));
  return g;
}

var helpers = {
  lm:lm, fm:fm, wireBox:wireBox, cyl:cylHelper,
  cable:cableHelper, tag:tagHelper, dimLine:dimLineHelper
};

// ── Grid ─────────────────────────────────────────────
scene.add(new THREE.GridHelper(50, 50, 0x152540, 0x0e1a2e));

// ── Build diagram ────────────────────────────────────
var S = 0.1;
var result = diagram.build(scene, S, helpers);
var groups = result.groups;
var explodeSmallY = result.explodeSmallY;
var explodeGrid = result.explodeGrid;
var hoverData = result.hoverData;

// Capture original positions
var origPos = {};
Object.keys(groups).forEach(function(k){
  origPos[k] = {x:groups[k].position.x, y:groups[k].position.y, z:groups[k].position.z};
});

// ── Explode slider ───────────────────────────────────
var slider = document.getElementById('explode');
function applyExplode(t){
  var f = t/100;
  var f1 = Math.min(f*2, 1.0);
  var f2 = Math.max((f-0.5)*2, 0);
  Object.keys(groups).forEach(function(k){
    if(k==='dims') return;
    var oy = (explodeSmallY[k]||0) * f1;
    var grid = explodeGrid[k] || {x:0,y:0,z:0};
    var orig = origPos[k];
    groups[k].position.x = orig.x + grid.x * f2;
    groups[k].position.y = orig.y + oy + grid.y * f2;
    groups[k].position.z = orig.z + grid.z * f2;
  });
}
slider.addEventListener('input',function(){applyExplode(parseFloat(slider.value));});
applyExplode(parseFloat(slider.value));

// ── Tabs ─────────────────────────────────────────────
var tabsEl = document.getElementById('tabs');
var activeTabId = null;
if(diagram.tabs && diagram.tabs.length > 0){
  diagram.tabs.forEach(function(tab, i){
    var btn = document.createElement('button');
    btn.textContent = tab.label;
    btn.dataset.tab = tab.id;
    if(i===0) btn.classList.add('active');
    btn.addEventListener('click', function(){
      activeTabId = tab.id;
      tabsEl.querySelectorAll('button').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      // Apply tab state
      if(result.tabStates && result.tabStates[tab.id]){
        var st = result.tabStates[tab.id];
        if(st.note) document.getElementById('state-note').innerHTML = st.note.replace(/\n/g,'<br>');
      }
      // For USB adapter: toggle explode slider
      if(tab.id === 'exploded'){
        slider.value = 80;
        applyExplode(80);
      } else if(tab.id === 'assembled'){
        slider.value = 20;
        applyExplode(20);
      }
    });
    tabsEl.appendChild(btn);
  });
  activeTabId = diagram.tabs[0].id;
  // Apply initial tab state
  if(result.tabStates && result.tabStates[activeTabId]){
    var initState = result.tabStates[activeTabId];
    if(initState.note) document.getElementById('state-note').innerHTML = initState.note.replace(/\n/g,'<br>');
  }
}

// ── Hover tooltips ───────────────────────────────────
var tooltipEl = document.getElementById('tooltip');
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();
var groupMeshMap = {};

if(hoverData){
  hoverData.forEach(function(h,i){
    var m = [];
    h.group.traverse(function(c){if(c.isMesh||c.isLineSegments||c.isLine) m.push(c);});
    groupMeshMap[i] = m;
  });
}

renderer.domElement.addEventListener('pointermove',function(e){
  if(orbit.drag){tooltipEl.style.display='none';return;}
  if(!hoverData) return;
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  var found = null;
  for(var i=0; i<hoverData.length; i++){
    if(raycaster.intersectObjects(groupMeshMap[i], false).length>0){found=hoverData[i]; break;}
  }
  if(found){
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = Math.min(e.clientX+16, innerWidth-340)+'px';
    tooltipEl.style.top = Math.min(e.clientY+16, innerHeight-160)+'px';
    tooltipEl.innerHTML = '<div class="label">'+found.label+'</div>'+found.desc;
    document.body.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    document.body.style.cursor = 'default';
  }
});

// ── Animate ──────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize',function(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

}); // end load
</script>
</body>
</html>
