# Pre-commit hooks for oasis_os
# Run manually: pre-commit run --all-files
# Install hooks: pre-commit install
# Skip specific hooks: SKIP=shellcheck git commit
# Auto-update hooks: pre-commit autoupdate

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: '^assets/oasis_demo\.mp4$'
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        types: [shell]
        args: [-x]

  # Rust formatting (auto-fix, runs on every commit)
  - repo: local
    hooks:
      - id: rust-fmt-oasis
        name: Rust format oasis_os
        entry: bash -c 'source "$HOME/.cargo/env" 2>/dev/null || true; cargo fmt --all'
        language: system
        files: '\.rs$'
        pass_filenames: false

      # Clippy lint (runs on every commit when .rs files change)
      - id: rust-clippy-oasis
        name: Rust lint oasis_os
        entry: bash -c 'source "$HOME/.cargo/env" 2>/dev/null || true; cargo clippy --workspace -- -D warnings'
        language: system
        files: '\.rs$'
        pass_filenames: false

      # Doc build with warnings-as-errors (runs on every commit when .rs files change)
      - id: rust-doc-oasis
        name: Rust doc build oasis_os
        entry: bash -c 'source "$HOME/.cargo/env" 2>/dev/null || true; RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps'
        language: system
        files: '\.rs$'
        pass_filenames: false

      # cargo-deny license/advisory audit (runs on pre-push when Cargo files change)
      - id: cargo-deny-oasis
        name: cargo-deny audit oasis_os
        entry: bash -c 'source "$HOME/.cargo/env" 2>/dev/null || true; cargo deny check'
        language: system
        files: '(Cargo\.toml|Cargo\.lock|deny\.toml)$'
        pass_filenames: false
        stages: [pre-push]

      # Markdown link check (runs on every commit when .md files change)
      - id: md-links-oasis
        name: Markdown link check oasis_os
        entry: bash -c 'FAIL=0; for f in *.md docs/*.md docs/adr/*.md scripts/psp-scenarios.md; do [ -e "$f" ] || continue; md-link-checker "$f" --internal-only || FAIL=1; done; exit $FAIL'
        language: system
        files: '\.md$'
        pass_filenames: false
