# GNOME Adwaita Dark theme
# Dark mode with muted blue/teal accents and clean rounded corners.

background = "#242424"
primary = "#3584E4"
secondary = "#303030"
text = "#FFFFFF"
dim_text = "#929292"
status_bar = "#1E1E1E"
prompt = "#33B2A4"
output = "#DEDDDA"
error = "#E01B24"
surface = "#303030"
accent_hover = "#62A0EA"

border_radius = 12
shadow_intensity = 1
gradient_enabled = false

[wm_theme]
titlebar_height = 36
border_width = 0
titlebar_active = "#303030"
titlebar_inactive = "#2A2A2A"
titlebar_text = "#FFFFFF"
frame_color = "#1E1E1E"
content_bg = "#242424"
btn_close = "#E01B24"
btn_minimize = "#303030"
btn_maximize = "#303030"
button_size = 16
titlebar_font_size = 13
titlebar_radius = 12
titlebar_gradient = false
frame_shadow_level = 1
frame_border_radius = 12
button_radius = 8
button_side = "right"
glyph_close = "x"
glyph_minimize = "-"
glyph_maximize = "□"
title_align = "center"
separator_enabled = false
glyph_close_color = "#FFFFFF"
glyph_minimize_color = "#929292"
glyph_maximize_color = "#929292"
btn_close_hover = "#F04B50"
btn_minimize_hover = "#404040"
btn_maximize_hover = "#404040"
title_text_shadow = false
content_stroke_width = 0
maximize_top_inset = 36
maximize_bottom_inset = 0
inactive_frame_alpha = 180

[bar_overrides]
# Top panel: solid Adwaita-dark with a thin underline separator.
statusbar_bg = "#0F0F0F"
statusbar_gradient_top = "#1A1A1A"
statusbar_gradient_bottom = "#0A0A0A"
# Bottom dock: same dark, slightly lighter so the pill stands out.
bar_bg = "#161616"
gradient_top = "#1C1C1C"
gradient_bottom = "#101010"
battery_color = "#E6E6E6"
version_color = "#929292"
clock_color = "#FFFFFF"
separator_color = "#3A3A3A"
text_shadow = false

[wallpaper]
style = "gradient"
color_stops = ["#1A5276", "#1E1E1E"]
wave_enabled = false
angle = 90

[geometry]
tab_row_height = 0
statusbar_height = 28
bottombar_height = 36
icon_width = 48
icon_height = 48
font_body = 13
font_hint = 11
font_heading = 16
cursor_blink_rate = 30
cursor_lerp_speed = 0.2
page_slide_duration = 10
press_flash_duration = 4
focus_ring_color = "#3584E480"
focus_ring_width = 2
cursor_pad = 4
toast_slide_in = true

[app_overrides]
app_bg = "#242424"
text_color = "#FFFFFF"
dim_text = "#929292"
title_bar_bg = "#303030"
title_bar_text = "#FFFFFF"
title_bar_height = 36
selection_accent_color = "#3584E450"
selection_border_radius = 8
input_border_radius = 8
terminal_output_color = "#DEDDDA"
terminal_prompt_color = "#33B2A4"

[icon_overrides]
body_color = "#303030"
fold_color = "#404040"
outline_color = "#FFFFFF10"
shadow_color = "#00000030"
label_color = "#FFFFFF"
cursor_color = "#3584E460"
icon_border_radius = 12
cursor_border_radius = 14
icon_style = "vector"
vector_preset = "outline"
icon_container = "chip"
cursor_style = "fill"

[start_menu_overrides]
# Flat panel (no gradient) so the translucent hover highlight stays one
# uniform shade across the cell.
panel_bg = "#222222"
panel_border = "#3A3A3A"
item_text = "#E6E6E6"
item_text_active = "#FFFFFF"
# Slightly translucent GNOME blue highlight. Because the panel above is
# now a flat colour, the highlight stays one consistent shade across the
# whole cell instead of picking up a top→bottom gradient.
highlight_color = "#3584E480"
button_bg = "#3584E4"
button_gradient = true
button_gradient_top = "#4A95EE"
button_gradient_bottom = "#2D75D6"
button_text = "#FFFFFF"
panel_border_radius = 16
panel_shadow_level = 3
button_label = "Activities"
button_width = 92
button_height = 26
button_shape = "round"
button_x = 8
panel_width = 360
columns = 3
layout_mode = "tiles"
header_text = ""
header_height = 0
footer_enabled = false
item_icon_size = 44
item_row_height = 88
pad_inner = 14
# Uniform tile color -- every item is the same GNOME blue so the
# overview reads as a coherent grid instead of a colored mosaic.
item_colors = [
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
    "#3584E4",
]

[browser_overrides]
chrome_bg = "#303030"
chrome_text = "#FFFFFF"
chrome_button_bg = "#404040"
url_bar_bg = "#1E1E1E"
url_bar_text = "#FFFFFF"
link_color = "#62A0EA"

[scrollbar_overrides]
track_color = "#2A2A2A"
thumb_color = "#505050"
thumb_hover_color = "#686868"
width = 8
