angle = 90

[geometry]
tab_row_height = 0
statusbar_height = 30
bottombar_height = 0
icon_width = 48
icon_height = 48
font_body = 13
font_hint = 11
font_heading = 16
cursor_blink_rate = 30
cursor_lerp_speed = 0.2
page_slide_duration = 10
press_flash_duration = 4
focus_ring_color = "#3584E480"
focus_ring_width = 2
cursor_pad = 4
toast_slide_in = true

[app_overrides]
app_bg = "#242424"
text_color = "#FFFFFF"
dim_text = "#929292"
title_bar_bg = "#303030"
title_bar_text = "#FFFFFF"
title_bar_height = 36
selection_accent_color = "#3584E450"
selection_border_radius = 8
input_border_radius = 8
terminal_output_color = "#DEDDDA"
terminal_prompt_color = "#33B2A4"

[icon_overrides]
body_color = "#303030"
fold_color = "#404040"
outline_color = "#FFFFFF10"
shadow_color = "#00000030"
label_color = "#FFFFFF"
cursor_color = "#3584E460"
icon_border_radius = 12
