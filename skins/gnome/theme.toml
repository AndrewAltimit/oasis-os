# GNOME Adwaita Dark theme
# Dark mode with muted blue/teal accents and clean rounded corners.

background = "#242424"
primary = "#3584E4"
secondary = "#303030"
text = "#FFFFFF"
dim_text = "#929292"
status_bar = "#1E1E1E"
prompt = "#33B2A4"
output = "#DEDDDA"
error = "#E01B24"
surface = "#303030"
accent_hover = "#62A0EA"

border_radius = 12
shadow_intensity = 1
gradient_enabled = false

[wm_theme]
titlebar_height = 36
border_width = 0
titlebar_active = "#303030"
titlebar_inactive = "#2A2A2A"
titlebar_text = "#FFFFFF"
frame_color = "#1E1E1E"
content_bg = "#242424"
btn_close = "#E01B24"
btn_minimize = "#303030"
btn_maximize = "#303030"
button_size = 16
titlebar_font_size = 13
titlebar_radius = 12
titlebar_gradient = false
frame_shadow_level = 1
frame_border_radius = 12
button_radius = 8
button_side = "right"
glyph_close = "x"
glyph_minimize = "-"
glyph_maximize = "□"
title_align = "center"
separator_enabled = false
glyph_close_color = "#FFFFFF"
glyph_minimize_color = "#929292"
glyph_maximize_color = "#929292"
btn_close_hover = "#F04B50"
btn_minimize_hover = "#404040"
btn_maximize_hover = "#404040"
title_text_shadow = false
content_stroke_width = 0
maximize_top_inset = 36
maximize_bottom_inset = 0
inactive_frame_alpha = 180

[bar_overrides]
statusbar_bg = "#1E1E1E"
bar_bg = "#1E1E1E"
battery_color = "#FFFFFF"
version_color = "#929292"
clock_color = "#FFFFFF"
separator_color = "#404040"
text_shadow = false

[wallpaper]
style = "gradient"
color_stops = ["#1A5276", "#1E1E1E"]
