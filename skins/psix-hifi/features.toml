# psix-hifi features -- PSIX-style desktop metaphor, tuned for fidelity.
dashboard = true
terminal = true
file_browser = true
browser = true
window_manager = true
dashboard_pages = 3
# Few icons per page so the left column stays sparse and PSIX-like:
# 2 columns x 3 rows fits the 480x272 content height without overlap.
icons_per_page = 6
grid_cols = 5
grid_rows = 3
start_menu = true
show_tabs = true
clock_in_bottombar = true

# Desktop icons: PSIX sparse LEFT-column flow (icons hug the left edge,
# left-aligned, not the centered phone grid). Two columns so all apps
# still fit at 480x272; drag & drop with per-skin persistence.
icon_layout = "column"
free_icon_cols = 2
snap_to_grid = true
launch_on_single_click = false
software_cursor = true

# Bottom bar becomes the PSIX media dock: transport pills + progress +
# volume + the AUDIO/VIDEO/IMAGE/FILE tab strip (forced on in dock mode).
bottombar_style = "media_dock"
show_media_tabs = true
