# Classic skin theme -- PSIX-style color palette with modern extensions
background = "#0E0E1C"
primary = "#4488CC"
secondary = "#2A2A3E"
text = "#E0E0F0"
dim_text = "#707090"
status_bar = "#18182C"
prompt = "#44CC88"
output = "#C0C0D8"
error = "#FF4466"

# Extended visual properties
border_radius = 4
shadow_intensity = 1
gradient_enabled = true

[geometry]
font_body = 12
font_hint = 10
font_heading = 14

[app_overrides]
selection_accent_color = "#4488CC80"
selection_border_radius = 3
