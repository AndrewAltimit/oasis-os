# psix-tribute features -- PSIX-style desktop metaphor on PSP-native 480x272
dashboard = true
terminal = true
file_browser = true
browser = true
window_manager = true
dashboard_pages = 2
icons_per_page = 15
grid_cols = 5
grid_rows = 3
start_menu = true
show_tabs = true
clock_in_bottombar = true

# Desktop icon layout: PSIX column auto-flow with drag & drop.
icon_layout = "free"
snap_to_grid = true
launch_on_single_click = false
software_cursor = true
