<!DOCTYPE html>
<html>
<head>
<title>Google</title>
<style>
body {
    margin: 0;
    font-family: sans-serif;
    background-color: #ffffff;
    color: #1f1f1f;
}
/* Top navigation bar */
.navbar {
    background-color: #2d2d2d;
    height: 30px;
    padding: 0 8px;
    overflow: hidden;
}
.navbar a {
    color: #cccccc;
    text-decoration: none;
    display: inline-block;
    padding: 0 5px;
    font-size: 13px;
    line-height: 27px;
}
.navbar a:hover {
    background-color: #4c4c4c;
}
.navbar .right {
    float: right;
}
/* Main content - centered */
.content {
    text-align: center;
    margin-top: 15px;
}
/* Google logo text */
.logo {
    font-size: 48px;
    margin-bottom: 10px;
}
.logo .g1 { color: #4285f4; }
.logo .g2 { color: #ea4335; }
.logo .g3 { color: #fbbc05; }
.logo .g4 { color: #4285f4; }
.logo .g5 { color: #34a853; }
.logo .g6 { color: #ea4335; }
/* Search box */
.search-box {
    display: inline-block;
    width: 300px;
    margin: 0 auto 8px;
}
.search-input {
    width: 290px;
    height: 20px;
    padding: 4px 8px;
    font-size: 14px;
    border: 1px solid #dfe1e5;
    border-radius: 12px;
    background-color: #ffffff;
    color: #1f1f1f;
}
/* Buttons */
.buttons {
    margin-top: 16px;
}
.btn {
    display: inline-block;
    background-color: #f8f9fa;
    border: 1px solid #f8f9fa;
    padding: 6px 16px;
    margin: 0 4px;
    font-size: 13px;
    color: #3c4043;
    cursor: pointer;
}
.btn:hover {
    border-color: #dadce0;
}
/* Footer links */
.footer-top {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
}
.footer-top a {
    color: #4285f4;
    text-decoration: none;
    margin: 0 8px;
}
.footer-bottom {
    text-align: center;
    font-size: 11px;
    color: #70757a;
    margin-top: 8px;
}
.footer-bottom a {
    color: #70757a;
    text-decoration: none;
    margin: 0 4px;
}
</style>
</head>
<body>
<!-- Top nav bar -->
<div class="navbar">
    <a href="#">Search</a>
    <a href="#">Images</a>
    <a href="#">Maps</a>
    <a href="#">Play</a>
    <a href="#">YouTube</a>
    <a href="#">News</a>
    <a href="#">Gmail</a>
    <a href="#">Drive</a>
    <a href="#">More</a>
    <span class="right">
        <a href="#">Sign in</a>
    </span>
</div>

<!-- Main content -->
<div class="content">
    <!-- Google logo using colored text -->
    <div class="logo">
        <span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g4">g</span><span class="g5">l</span><span class="g6">e</span>
    </div>

    <!-- Search box -->
    <div class="search-box">
        <input class="search-input" type="text" name="q" value="" title="Search">
    </div>

    <!-- Buttons -->
    <div class="buttons">
        <input type="submit" class="btn" value="Google Search">
        <input type="submit" class="btn" value="I'm Feeling Lucky">
    </div>
</div>

<!-- Footer -->
<div class="footer-top">
    <a href="#">Advertising</a>
    <a href="#">Business Solutions</a>
    <a href="#">About Google</a>
</div>
<div class="footer-bottom">
    &copy; 2026 - <a href="#">Privacy</a> - <a href="#">Terms</a>
</div>

</body>
</html>
