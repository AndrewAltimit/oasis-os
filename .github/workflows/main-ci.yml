---
name: Main CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release (even without tag)'
        required: false
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run criterion benchmarks'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: main-ci-${{ github.sha }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  # rust-psp revision for the PSP builds: every PSP crate pins its `psp`
  # dependency to it (scripts/check-rust-psp-rev.sh enforces that) and CI
  # installs cargo-psp from it. Bump both together, along with the nightly
  # in the crates' rust-toolchain.toml (rust-psp's CI NIGHTLY_DATE) and the
  # ARGs in docker/psp-build.Dockerfile; the pin check below fails on drift.
  RUST_PSP_REV: e4cc06f6fa50fa45dc3ae8b332e8a2b67625f588
  # PSP builds fail on rustc warnings. Passed with `cargo psp --config`, which
  # appends to the crates' `.cargo/config.toml` build.rustflags (RUSTFLAGS
  # would replace them and drop the psp-ld linker setup).
  PSP_DENY_WARNINGS: 'build.rustflags=["-D", "warnings"]'

jobs:
  ci:
    name: CI Pipeline
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      # -- Cleanup & Setup ---------------------------------------------------
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      - name: Set UID/GID
        run: |
          echo "USER_ID=$(id -u)" >> $GITHUB_ENV
          echo "GROUP_ID=$(id -g)" >> $GITHUB_ENV

      - name: Build CI Docker image
        run: docker compose --profile ci build rust-ci

      # -- Format Check ------------------------------------------------------
      - name: Format check
        timeout-minutes: 5
        run: docker compose --profile ci run --rm rust-ci cargo fmt --all -- --check

      # -- Clippy Lint -------------------------------------------------------
      - name: Clippy
        timeout-minutes: 10
        run: docker compose --profile ci run --rm rust-ci cargo clippy --workspace --all-targets -- -D warnings

      # -- Feature-set checks ------------------------------------------------
      # The oasis-app feature-combination check plus clippy over the supported
      # non-default feature sets, none of which the workspace clippy compiles.
      # The command list lives in the script, shared with pr-validation.yml.
      # Each line is a single-crate build, so it reuses the workspace build's
      # dependencies from the clippy step above.
      - name: Clippy (non-default feature sets)
        timeout-minutes: 25
        run: docker compose --profile ci run --rm rust-ci scripts/ci-feature-clippy.sh

      # -- Nightly Clippy (advisory) -----------------------------------------
      - name: Clippy (nightly, advisory)
        timeout-minutes: 10
        continue-on-error: true
        run: >
          docker compose --profile ci run --rm rust-ci
          cargo +nightly clippy --workspace --all-targets -- -D warnings

      # -- Documentation Build -----------------------------------------------
      - name: Doc build
        timeout-minutes: 10
        run: >
          docker compose --profile ci run --rm
          -e RUSTDOCFLAGS="-D warnings"
          rust-ci cargo doc --workspace --no-deps

      # -- Markdown Link Check -----------------------------------------------
      - name: Markdown link check
        timeout-minutes: 5
        run: |
          FAIL=0
          for target in *.md docs/ scripts/psp-scenarios.md; do
            [ -e "$target" ] || continue
            md-link-checker "$target" --internal-only || FAIL=1
          done
          exit $FAIL

      # -- Tests -------------------------------------------------------------
      # cargo-nextest runs all test binaries on one parallel pool (cargo test
      # runs them serially; the oasis-app e2e suites take minutes each in
      # debug). Doc-tests aren't supported by nextest, so they run after.
      # A per-test hang guard lives in .config/nextest.toml.
      - name: Test
        timeout-minutes: 30
        run: |
          set -o pipefail
          docker compose --profile ci run --rm rust-ci bash -c "
            set -e
            cargo nextest run --workspace --profile ci
            cargo test --workspace --doc
          " 2>&1 | tee test_output.txt

      - name: Test metrics summary
        if: always()
        run: |
          if [ ! -f test_output.txt ]; then
            echo "No test output captured (test step may have been skipped)."
            echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "No test output available." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          sed 's/\x1b\[[0-9;]*m//g' test_output.txt > test_output_plain.txt
          echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # nextest's final line, e.g. "Summary [ 312s] 9000 tests run: ..."
          grep -E '^ *Summary \[' test_output_plain.txt | tail -1 \
            >> $GITHUB_STEP_SUMMARY || true
          # Doc-tests (cargo test) print one "test result:" line per crate.
          DOC_PASS=$(grep -E '^test result:' test_output_plain.txt \
            | awk '{s += $4} END {print s + 0}')
          DOC_FAIL=$(grep -E '^test result:' test_output_plain.txt \
            | awk '{s += $6} END {print s + 0}')
          echo "Doc-tests: $DOC_PASS passed, $DOC_FAIL failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # -- Release Build -----------------------------------------------------
      # Builds every workspace binary, including screenshot-tests below.
      - name: Build (release)
        timeout-minutes: 25
        run: docker compose --profile ci run --rm rust-ci cargo build --workspace --release

      # -- Screenshot Regression ---------------------------------------------
      # Run the binary the release build just produced. `cargo run -p
      # oasis-app` resolves features for oasis-app alone rather than the
      # whole workspace, so it would recompile every dependency with
      # fat LTO (~5 min) instead of reusing the build above.
      # The wrapper adds the from-source libSDL3.so.0 dir to LD_LIBRARY_PATH
      # (which `cargo run` did implicitly).
      - name: Screenshot tests (generate)
        timeout-minutes: 10
        run: |
          docker compose --profile ci run --rm \
            -e SDL_VIDEODRIVER=dummy -e SDL_RENDER_DRIVER=software \
            -e OASIS_FIXED_TIME="2025-06-15 12:00:00" \
            -e OASIS_FIXED_FRAME=0 \
            rust-ci scripts/run-release-bin.sh screenshot-tests

      - name: Screenshot regression comparison
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        run: |
          if [ -d screenshots/baseline ]; then
            bash scripts/compare-screenshots.sh \
              --baseline screenshots/baseline \
              --actual screenshots/tests \
              --threshold 0.1
          else
            echo "No baselines found -- skipping regression comparison."
            echo "To generate baselines, run locally:"
            echo "  OASIS_FIXED_TIME='2025-06-15 12:00:00' OASIS_FIXED_FRAME=0 \\"
            echo "    cargo run -p oasis-app --bin screenshot-tests --release -- --bless"
            echo "  cp -r screenshots/tests/ screenshots/baseline/"
            echo "Then commit screenshots/baseline/ to the repository."
          fi

      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-report
          path: screenshots/tests/
          if-no-files-found: ignore
          retention-days: 14

      # -- cargo-deny --------------------------------------------------------
      - name: cargo-deny
        timeout-minutes: 10
        run: docker compose --profile ci run --rm rust-ci scripts/cargo-deny.sh

      # -- Benchmarks (manual) -----------------------------------------------
      - name: Benchmarks
        timeout-minutes: 60
        if: inputs.run_benchmarks == true
        run: |
          set -o pipefail
          docker compose --profile ci run --rm rust-ci \
            cargo bench --workspace 2>&1 | tee bench_results.txt
          echo "::group::Benchmark Results"
          grep -E '(time:|bench)' bench_results.txt || true
          echo "::endgroup::"

      - name: Upload benchmark results
        if: inputs.run_benchmarks == true
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench_results.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload criterion baseline
        if: inputs.run_benchmarks == true
        uses: actions/upload-artifact@v7
        with:
          name: criterion-baseline
          path: target/criterion/
          if-no-files-found: ignore
          retention-days: 90

      # -- Coverage ----------------------------------------------------------
      - name: Coverage (cargo-llvm-cov)
        timeout-minutes: 30
        continue-on-error: true
        run: |
          docker compose --profile ci run --rm rust-ci bash -c "
            rustup component add llvm-tools-preview 2>/dev/null || true
            cargo install cargo-llvm-cov --locked 2>/dev/null || true
            if command -v cargo-llvm-cov &>/dev/null; then
              cargo llvm-cov --workspace --no-fail-fast \
                --ignore-filename-regex '(tests?\.rs|benches?\.rs|main\.rs)' \
                --fail-under-lines 70 \
                2>&1 | tee /app/coverage_output.txt
            else
              echo 'cargo-llvm-cov not available, skipping coverage'
            fi
          "

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage_output.txt ]; then
            echo "### Coverage" >> $GITHUB_STEP_SUMMARY
            echo "Coverage step was skipped or unavailable." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 coverage_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # -- PSP Backend Build -------------------------------------------------
      - name: Check rust-psp pins
        timeout-minutes: 2
        run: scripts/check-rust-psp-rev.sh "$RUST_PSP_REV"

      # Stdlib-only unit tests for the PSP remote tool (scripts/psp_remote.py).
      # Runs on the host python3 the PSP build already needs (prxgen helper).
      - name: PSP tooling tests (python)
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Install cargo-psp
        timeout-minutes: 30
        uses: ./.github/actions/install-cargo-psp
        with:
          rev: ${{ env.RUST_PSP_REV }}

      - name: Build PSP EBOOT
        timeout-minutes: 30
        run: |
          cd crates/oasis-backend-psp
          RUST_PSP_BUILD_STD=1 cargo psp --release --config "$PSP_DENY_WARNINGS"

      # cargo psp's PRX still carries the MIPS .pdr descriptors, symbol table
      # and strings (~135 KB the module loader never reads); prxmin (shipped
      # with cargo-psp) keeps only the loaded sections + relocations. The
      # stripped file is the release artifact and is held to a size budget
      # (see docs/psp-plugin.md, Memory Budget).
      - name: Build PSP Plugin PRX
        timeout-minutes: 20
        env:
          PRX_SIZE_BUDGET: 196608 # 192 KiB; v1.4.0 strips to ~153 KiB
        run: |
          cd crates/oasis-plugin-psp
          RUST_PSP_BUILD_STD=1 cargo psp --release --config "$PSP_DENY_WARNINGS"
          out=target/mipsel-sony-psp-std/release
          prxmin "$out/oasis-plugin-psp.prx" "$out/oasis-overlay.prx"
          size=$(stat -c %s "$out/oasis-overlay.prx")
          echo "Overlay PRX (stripped): $size bytes, budget $PRX_SIZE_BUDGET" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$PRX_SIZE_BUDGET" ]; then
            echo "::error::overlay PRX is $size bytes, over the $PRX_SIZE_BUDGET budget"
            exit 1
          fi

      - name: Build PSP Recovery EBOOT
        timeout-minutes: 20
        run: |
          cd crates/oasis-recovery-psp
          RUST_PSP_BUILD_STD=1 cargo psp --release --config "$PSP_DENY_WARNINGS"

      # The other standalone PSP crates: the ME boot PRX the EBOOT loads for
      # H.264 decode (shipped below) and the dev / research tools (devloop,
      # PRX decryptor, USB thin client and host-mode / VBUS experiments),
      # built so they keep compiling against the pinned rust-psp.
      - name: Build standalone PSP crates
        timeout-minutes: 40
        run: |
          for crate in oasis-me-boot oasis-devloop-psp oasis-prx-decrypt-psp \
              oasis-usb-client-psp oasis-usb-debug-psp oasis-usb-trace-psp \
              oasis-usb-vbus-psp; do
            echo "::group::$crate"
            (cd "crates/$crate" && RUST_PSP_BUILD_STD=1 cargo psp --release \
              --config "$PSP_DENY_WARNINGS")
            echo "::endgroup::"
          done

      - name: Collect PSP artifacts
        if: always()
        run: |
          mkdir -p psp-artifacts
          cp crates/oasis-backend-psp/target/mipsel-sony-psp-std/release/EBOOT.PBP \
            psp-artifacts/OASIS-OS.PBP 2>/dev/null || true
          cp crates/oasis-plugin-psp/target/mipsel-sony-psp-std/release/oasis-overlay.prx \
            psp-artifacts/oasis-overlay.prx 2>/dev/null || true
          cp crates/oasis-recovery-psp/target/mipsel-sony-psp-std/release/EBOOT.PBP \
            psp-artifacts/RECOVERY.PBP 2>/dev/null || true
          cp crates/oasis-me-boot/target/mipsel-sony-psp-std/release/oasis-me-boot.prx \
            psp-artifacts/oasis-me-boot.prx 2>/dev/null || true
          ls -la psp-artifacts/

      - name: Upload PSP artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psp-artifacts
          path: psp-artifacts/*
          if-no-files-found: ignore
          retention-days: 90

      # -- PSP Emulator Test -------------------------------------------------
      # Boots OASIS-OS (normal boot + built-in self-test) and the recovery
      # EBOOT; fails on a crash, an early exit or missing boot markers.
      - name: PSP smoke test (PPSSPPHeadless)
        timeout-minutes: 15
        env:
          PSP_SMOKE_WORKDIR: ${{ runner.temp }}/psp-smoke
        run: scripts/psp-smoke-test.sh

      # -- Cleanup -----------------------------------------------------------
      - name: Fix Docker file ownership
        if: always()
        run: |
          for dir in target outputs; do
            if [ -d "$dir" ]; then
              docker run --rm -v "$(pwd)/$dir:/workspace" busybox:1.38.0 \
                chown -Rh "$(id -u):$(id -g)" /workspace 2>/dev/null || true
            fi
          done

      # -- Summary -----------------------------------------------------------
      - name: CI Summary
        if: always()
        run: |
          echo "## Main CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Create issue on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Main CI Failed: $(date +%Y-%m-%d)" \
            --body "$(cat <<'ISSUE_EOF'
          ## CI Failure Report

          **Commit**: ${{ github.sha }}
          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please investigate and fix the issues.
          ISSUE_EOF
          )" \
            --label "ci-failure,automated" || echo "::warning::Could not create failure issue"

  # -- Build Desktop Binaries (separate job, depends on CI) ---------------
  # Runs on every main-ci trigger — not just tagged releases — so each run
  # has the desktop linux binaries attached as an `oasis-binaries` artifact
  # alongside the PSP `psp-artifacts` already uploaded by the `ci` job.
  # The downstream `create-release` job stays tag-gated; this job only
  # uploads to the run, it does not publish a GitHub Release.
  build-release-binaries:
    name: Build Desktop Binaries
    needs: ci
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs release-binaries .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      - name: Set UID/GID
        run: |
          echo "USER_ID=$(id -u)" >> $GITHUB_ENV
          echo "GROUP_ID=$(id -g)" >> $GITHUB_ENV

      - name: Create output directory
        run: mkdir -p release-binaries

      - name: Build oasis-app and oasis-ffi binaries (release) via container
        timeout-minutes: 35
        run: |
          ARCH=$(uname -m)
          echo "Building oasis_os binaries for linux-${ARCH}..."

          docker compose --profile ci run --rm rust-ci bash -c "
            set -e
            cargo build --workspace --release

            for bin in oasis-app oasis-screenshot; do
              if [ -f \"target/release/\$bin\" ]; then
                cp \"target/release/\$bin\" \"/app/release-binaries/\${bin}-linux-${ARCH}\"
                echo \"Built \$bin for linux-${ARCH}\"
              else
                echo \"Warning: \$bin not found in release output\"
              fi
            done

            # FFI shared library
            for ext in so dylib dll; do
              if [ -f \"target/release/liboasis_ffi.\$ext\" ]; then
                cp \"target/release/liboasis_ffi.\$ext\" \"/app/release-binaries/liboasis_ffi-linux-${ARCH}.\$ext\"
                echo \"Built liboasis_ffi.\$ext for linux-${ARCH}\"
              fi
            done
          "

      - name: List built binaries
        run: |
          echo "Built binaries:"
          ls -la release-binaries/
          file release-binaries/* || true

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oasis-binaries
          path: release-binaries/*
          # Short retention: this job runs on every main-ci, so artifacts
          # accumulate quickly. The tag-gated `create-release` job consumes
          # them immediately, so 7 days is sufficient for that handoff and
          # for short-term debugging of recent runs.
          retention-days: 7

  # -- Create GitHub Release -----------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-release-binaries]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target release-binaries .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches Cargo version
        # A release tag must name the version the binaries were built with
        # (v1.5.0 once shipped 1.4.0 binaries). Checks the workspace version
        # and the standalone PSP crates; dispatch-only releases have no tag.
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check-release-version.py "$GITHUB_REF"

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: oasis-binaries
          path: release-artifacts/binaries

      - name: Download PSP artifacts
        uses: actions/download-artifact@v8
        with:
          name: psp-artifacts
          path: release-artifacts/psp

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog from merged PRs
        id: changelog
        run: |
          CURRENT_TAG="${{ steps.version.outputs.version }}"

          # Find the previous release tag for comparison
          PREVIOUS_TAG=$(git tag --sort=-version:refname --list 'v[0-9]*' | grep -Fxv "$CURRENT_TAG" | head -n 1)

          CHANGELOG=""
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog: ${PREVIOUS_TAG}...${CURRENT_TAG}"
            CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$CURRENT_TAG" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi

          if [ -n "$CHANGELOG" ]; then
            printf '%s\n' "$CHANGELOG" > changelog_snippet.md
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "Changelog generated successfully"
          else
            echo "No changelog generated"
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## Release ${{ steps.version.outputs.version }}

          ### Desktop

          | Binary | Description |
          |--------|-------------|
          | `oasis-app-linux-*` | Desktop entry point (SDL3 backend) |
          | `oasis-screenshot-linux-*` | Screenshot capture utility |
          | `liboasis_ffi-linux-*` | C-ABI shared library for UE5 and external integrations |

          ### PSP

          | Binary | Install Path | Description |
          |--------|-------------|-------------|
          | `OASIS-OS.PBP` | `ms0:/PSP/GAME/OASISOS/EBOOT.PBP` | Main application (sceGu rendering, TLS 1.3, ME video decode) |
          | `oasis-me-boot.prx` | `ms0:/PSP/GAME/OASISOS/oasis-me-boot.prx` | Media Engine boot module the main application loads for hardware H.264 decode |
          | `oasis-overlay.prx` | `ms0:/seplugins/oasis_plugin.prx` | Kernel overlay plugin (in-game UI + background MP3) |
          | `RECOVERY.PBP` | `ms0:/PSP/SAVEDATA/ARK_01234/RECOVERY.PBP` | Network recovery (WiFi TCP file server for unbricking) |

          ### Quick Start

          **Desktop:**
          ```bash
          chmod +x oasis-app-linux-*
          ./oasis-app-linux-*
          ```

          **PSP:** Copy files to Memory Stick, add `game, ms0:/seplugins/oasis_plugin.prx, on` to `PLUGINS.TXT` (the name the OASIS terminal's `plugin status` / `plugin remove` expect). Requires ARK-4 or PRO CFW on firmware 6.61.

          **Browser:** [Try it online](https://andrewaltimit.github.io/oasis-os/demo/) -- no install required.

          ### Requirements

          - Desktop: SDL3 runtime libraries
          - PSP: ARK-4 or PRO CFW, firmware 6.61
          - Browser: Any modern browser with WebAssembly support

          ### Commit Information

          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          EOF

          # Append auto-generated changelog if available
          if [ "${{ steps.changelog.outputs.has_changelog }}" = "true" ] && [ -f changelog_snippet.md ]; then
            printf '\n---\n\n' >> release_notes.md
            cat changelog_snippet.md >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release-artifacts/binaries/*
            release-artifacts/psp/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -- Deploy GitHub Pages --------------------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install wasm-pack
        timeout-minutes: 5
        run: |
          if ! command -v wasm-pack &>/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: Build WASM
        timeout-minutes: 20
        run: ./scripts/build-wasm.sh --release

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/demo
          rsync -a --exclude screenshots site/ _site/
          cp -r screenshots/ _site/screenshots/
          cp -r pkg/ _site/pkg/
          cp www/index.js _site/demo/index.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 drops dotfiles by default; keep site/.nojekyll.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
