---
name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run criterion benchmark regression gate (slow — off by default)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  # rust-psp revision for the PSP builds: every PSP crate pins its `psp`
  # dependency to it (scripts/check-rust-psp-rev.sh enforces that) and CI
  # installs cargo-psp from it. Bump both together, along with the nightly
  # in the crates' rust-toolchain.toml (rust-psp's CI NIGHTLY_DATE) and the
  # ARGs in docker/psp-build.Dockerfile; the pin check below fails on drift.
  RUST_PSP_REV: e4cc06f6fa50fa45dc3ae8b332e8a2b67625f588
  # PSP builds fail on rustc warnings. Passed with `cargo psp --config`, which
  # appends to the crates' `.cargo/config.toml` build.rustflags (RUSTFLAGS
  # would replace them and drop the psp-ld linker setup).
  PSP_DENY_WARNINGS: 'build.rustflags=["-D", "warnings"]'

jobs:
  # Fork guard: block fork PRs from running on self-hosted runners with write perms
  fork-guard:
    name: Fork PR Guard
    runs-on: self-hosted
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - run: echo "Not a fork PR - proceeding"

  # -- CI Stages (containerized) -------------------------------------------
  ci:
    name: OASIS_OS CI
    needs: fork-guard
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Set UID/GID
        run: |
          echo "USER_ID=$(id -u)" >> $GITHUB_ENV
          echo "GROUP_ID=$(id -g)" >> $GITHUB_ENV

      - name: Build CI Docker image
        run: docker compose --profile ci build rust-ci

      # -- Formatting -------------------------------------------------------
      - name: Format check
        timeout-minutes: 5
        run: docker compose --profile ci run --rm rust-ci cargo fmt --all -- --check

      # -- Linting -----------------------------------------------------------
      - name: Clippy
        timeout-minutes: 10
        run: docker compose --profile ci run --rm rust-ci cargo clippy --workspace --all-targets -- -D warnings

      # -- Feature-set checks ------------------------------------------------
      # Same script as main-ci.yml: the oasis-app feature-combination check and
      # clippy over the supported non-default feature sets, which the workspace
      # clippy never compiles. Without it here a PR can pass and break main.
      - name: Clippy (non-default feature sets)
        timeout-minutes: 25
        run: docker compose --profile ci run --rm rust-ci scripts/ci-feature-clippy.sh

      # -- Nightly Warnings Check (advisory) -----------------------------------
      - name: Nightly warnings check
        timeout-minutes: 10
        continue-on-error: true
        run: >
          docker compose --profile ci run --rm rust-ci
          cargo +nightly clippy --workspace --all-targets -- -D warnings
          -W unused-comparisons

      # -- Documentation ------------------------------------------------------
      - name: Doc build
        timeout-minutes: 10
        run: >
          docker compose --profile ci run --rm
          -e RUSTDOCFLAGS="-D warnings"
          rust-ci cargo doc --workspace --no-deps

      # -- Markdown Link Check ------------------------------------------------
      - name: Markdown link check
        timeout-minutes: 5
        run: |
          set -o pipefail
          FAIL=0
          # Check top-level markdown and docs/ (skip vendored target/node_modules)
          for target in *.md docs/ scripts/psp-scenarios.md; do
            [ -e "$target" ] || continue
            md-link-checker "$target" --internal-only 2>&1 \
              | tee -a link_check_output.txt || FAIL=1
          done
          if [ $FAIL -ne 0 ]; then
            echo "### Markdown Link Check" >> $GITHUB_STEP_SUMMARY
            grep -E '(broken link|->.*not found)' link_check_output.txt \
              >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
          exit $FAIL

      # -- Tests -------------------------------------------------------------
      # cargo-nextest runs all test binaries on one parallel pool (cargo test
      # runs them serially; the oasis-app e2e suites take minutes each in
      # debug). Doc-tests aren't supported by nextest, so they run after.
      # A per-test hang guard lives in .config/nextest.toml.
      - name: Test
        timeout-minutes: 30
        run: |
          set -o pipefail
          docker compose --profile ci run --rm rust-ci bash -c "
            set -e
            cargo nextest run --workspace --profile ci
            cargo test --workspace --doc
          " 2>&1 | tee test_output.txt

      # -- Build -------------------------------------------------------------
      # Builds every workspace binary, including screenshot-tests below.
      - name: Build (release)
        timeout-minutes: 25
        run: docker compose --profile ci run --rm rust-ci cargo build --workspace --release

      # -- Screenshot Regression Tests ----------------------------------------
      # Run the binary the release build just produced. `cargo run -p
      # oasis-app` resolves features for oasis-app alone rather than the
      # whole workspace, so it would recompile every dependency with
      # fat LTO (~5 min) instead of reusing the build above.
      # The wrapper adds the from-source libSDL3.so.0 dir to LD_LIBRARY_PATH
      # (which `cargo run` did implicitly).
      - name: Screenshot tests (generate)
        timeout-minutes: 10
        run: |
          docker compose --profile ci run --rm \
            -e SDL_VIDEODRIVER=dummy -e SDL_RENDER_DRIVER=software \
            -e OASIS_FIXED_TIME="2025-06-15 12:00:00" \
            -e OASIS_FIXED_FRAME=0 \
            rust-ci scripts/run-release-bin.sh screenshot-tests

      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-report
          path: screenshots/tests/
          if-no-files-found: ignore
          retention-days: 14

      # -- License / Advisory ------------------------------------------------
      - name: cargo-deny
        timeout-minutes: 10
        run: docker compose --profile ci run --rm rust-ci scripts/cargo-deny.sh

      # -- Benchmarks (regression gate) ----------------------------------------
      # Skipped by default — the criterion bench suite is the slowest CI
      # step and its signal-to-noise ratio on PR branches is poor (small
      # changes trip the 20% regression gate on criterion noise alone).
      # Run explicitly via:
      #   Actions -> Pull Request Validation -> Run workflow
      #   (set "Run criterion benchmark regression gate" to true)
      # main-ci.yml publishes the baseline from a main run dispatched with
      # run_benchmarks (artifact kept 90 days).
      # Only GitHub-maintained tooling here (gh CLI + actions/download-artifact):
      # find the newest unexpired criterion-baseline from main-ci on main, then
      # download it from that run.
      - name: Find main branch baseline
        id: baseline
        timeout-minutes: 5
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=criterion-baseline&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No criterion-baseline artifact from main; the gate has no baseline"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download main branch baseline
        timeout-minutes: 5
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: criterion-baseline
          path: baseline-criterion/
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Benchmarks
        timeout-minutes: 60
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        run: |
          set -o pipefail
          docker compose --profile ci run --rm rust-ci \
            cargo bench --workspace 2>&1 | tee bench_results.txt
          echo "::group::Benchmark Results"
          grep -E '(time:|bench)' bench_results.txt || true
          echo "::endgroup::"

      - name: Benchmark regression gate
        timeout-minutes: 5
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        run: |
          BENCH_GATE=1 bash scripts/bench-compare.sh \
            baseline-criterion/ \
            target/criterion/ \
            20 \
            >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.run_benchmarks
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench_results.txt
          if-no-files-found: ignore
          retention-days: 30

      # -- Test Metrics -------------------------------------------------------
      - name: Test metrics summary
        if: always()
        run: |
          if [ ! -f test_output.txt ]; then
            echo "No test output captured (test step may have been skipped)."
            echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "No test output available." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          sed 's/\x1b\[[0-9;]*m//g' test_output.txt > test_output_plain.txt
          echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # nextest's final line, e.g. "Summary [ 312s] 9000 tests run: ..."
          grep -E '^ *Summary \[' test_output_plain.txt | tail -1 \
            >> $GITHUB_STEP_SUMMARY || true
          # Doc-tests (cargo test) print one "test result:" line per crate.
          DOC_PASS=$(grep -E '^test result:' test_output_plain.txt \
            | awk '{s += $4} END {print s + 0}')
          DOC_FAIL=$(grep -E '^test result:' test_output_plain.txt \
            | awk '{s += $6} END {print s + 0}')
          echo "Doc-tests: $DOC_PASS passed, $DOC_FAIL failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # -- PSP Backend Build -------------------------------------------------
      - name: Check rust-psp pins
        timeout-minutes: 2
        run: scripts/check-rust-psp-rev.sh "$RUST_PSP_REV"

      # Stdlib-only unit tests for the PSP remote tool (scripts/psp_remote.py).
      # Runs on the host python3 the PSP build already needs (prxgen helper).
      - name: PSP tooling tests (python)
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Install cargo-psp
        timeout-minutes: 30
        uses: ./.github/actions/install-cargo-psp
        with:
          rev: ${{ env.RUST_PSP_REV }}

      - name: Build PSP EBOOT
        timeout-minutes: 30
        run: |
          cd crates/oasis-backend-psp
          RUST_PSP_BUILD_STD=1 cargo psp --release --config "$PSP_DENY_WARNINGS"

      # -- PSP Emulator Test -------------------------------------------------
      # Boots OASIS-OS (normal boot + built-in self-test); fails on a crash,
      # an early exit or missing boot markers.
      - name: PSP smoke test (PPSSPPHeadless)
        timeout-minutes: 15
        env:
          PSP_SMOKE_WORKDIR: ${{ runner.temp }}/psp-smoke
        run: >-
          scripts/psp-smoke-test.sh --backend
          crates/oasis-backend-psp/target/mipsel-sony-psp-std/release/EBOOT.PBP

      - name: Fix Docker file ownership
        if: always()
        run: |
          for dir in target outputs; do
            if [ -d "$dir" ]; then
              docker run --rm -v "$(pwd)/$dir:/workspace" busybox:1.38.0 \
                chown -Rh "$(id -u):$(id -g)" /workspace 2>/dev/null || true
            fi
          done

  # -- Claude Code Security Review (profile-based) -------------------------
  claude-security-review:
    name: Claude Code Security Review
    needs: fork-guard
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      review_status: ${{ steps.review-action.outputs.review_status }}
      is_agent_commit: ${{ steps.review-action.outputs.is_agent_commit }}
      review_artifact_name: ${{ steps.review-action.outputs.review_artifact_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Run Claude security review
        id: review-action
        uses: ./.github/actions/claude-review
        with:
          pr_number: ${{ github.event.pull_request.number }}
          profile: 'security'

  # -- Claude Code Quality Review (runs in parallel with security) ---------
  claude-quality-review:
    name: Claude Code Quality Review
    needs: fork-guard
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      review_status: ${{ steps.review-action.outputs.review_status }}
      is_agent_commit: ${{ steps.review-action.outputs.is_agent_commit }}
      review_artifact_name: ${{ steps.review-action.outputs.review_artifact_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Run Claude quality review
        id: review-action
        uses: ./.github/actions/claude-review
        with:
          pr_number: ${{ github.event.pull_request.number }}
          profile: 'quality'

  # -- OpenRouter General Review (runs in parallel with Claude reviews) ----
  openrouter-review:
    name: OpenRouter AI General Review
    needs: fork-guard
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: self-hosted
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      review_status: ${{ steps.review-action.outputs.review_status }}
      is_agent_commit: ${{ steps.review-action.outputs.is_agent_commit }}
      review_artifact_name: ${{ steps.review-action.outputs.review_artifact_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Run OpenRouter review
        id: review-action
        uses: ./.github/actions/openrouter-review
        with:
          pr_number: ${{ github.event.pull_request.number }}
          profile: 'openrouter-general'

  # -- Agent Review Response (responds to Claude/OpenRouter feedback) ------
  agent-review-response:
    name: Agent Review Response
    needs: [ci, claude-security-review, claude-quality-review, openrouter-review]
    if: |
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-fix')
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      made_changes: ${{ steps.agent-fix.outputs.made_changes }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false
          token: ${{ secrets.AGENT_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Ensure clean working directory
        run: |
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

      - name: Check iteration count
        id: iteration
        uses: ./.github/actions/agent-iteration-check
        with:
          pr_number: ${{ github.event.pull_request.number }}
          max_iterations: '5'
          agent_type: 'review-fix'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if max iterations reached
        if: steps.iteration.outputs.exceeded_max == 'true'
        run: |
          echo "Maximum iterations (5) reached for review-fix agent. Manual intervention required."
          echo "made_changes=false" >> $GITHUB_OUTPUT
          exit 0

      - name: Download review artifacts
        if: steps.iteration.outputs.should_skip != 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: '*-review-${{ github.run_id }}-${{ github.run_attempt }}'
          merge-multiple: true
          path: .

      - name: Set Docker user environment
        if: steps.iteration.outputs.should_skip != 'true'
        run: |
          echo "USER_ID=$(id -u)" >> $GITHUB_ENV
          echo "GROUP_ID=$(id -g)" >> $GITHUB_ENV

      - name: Run agent review response
        id: agent-fix
        if: steps.iteration.outputs.should_skip != 'true'
        env:
          CLAUDE_SECURITY_REVIEW_PATH: claude-security-review.md
          CLAUDE_QUALITY_REVIEW_PATH: claude-quality-review.md
          OPENROUTER_REVIEW_PATH: openrouter-review.md
          GEMINI_REVIEW_PATH: ""
          CODEX_REVIEW_PATH: ""
          BRANCH_NAME: ${{ github.head_ref }}
          ITERATION_COUNT: ${{ steps.iteration.outputs.iteration_count }}
        run: |
          if ! command -v automation-cli &>/dev/null; then
            echo "::warning::automation-cli not found on PATH - skipping review response"
            echo "made_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Running agent review response..."
          automation-cli review respond \
            "$PR_NUMBER" \
            "$BRANCH_NAME" \
            "$ITERATION_COUNT" \
            "5"

  # -- Agent Failure Handler -----------------------------------------------
  agent-failure-handler:
    name: Agent Failure Handler
    needs: [ci, claude-security-review, claude-quality-review, openrouter-review, agent-review-response]
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-auto-fix') &&
      needs.ci.result == 'failure'
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      made_changes: ${{ steps.agent-fix.outputs.made_changes }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Pre-checkout cleanup
        # Earlier containers can leave root-owned files the runner user can't
        # delete; only those fall back to a root busybox container. Never sudo:
        # on an interactive runner it blocks on a password prompt.
        run: |
          for item in outputs target psp_output_file.log .git/index.lock; do
            [ -e "$item" ] || continue
            rm -rf -- "$item" 2>/dev/null ||
              docker run --rm -v "$PWD:/workspace" busybox:1.38.0 rm -rf "/workspace/$item" ||
              echo "::warning::could not remove $item"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false
          token: ${{ secrets.AGENT_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Ensure clean working directory
        run: |
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

      - name: Check iteration count
        id: iteration
        uses: ./.github/actions/agent-iteration-check
        with:
          pr_number: ${{ github.event.pull_request.number }}
          max_iterations: '5'
          agent_type: 'failure-fix'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if max iterations reached
        if: steps.iteration.outputs.exceeded_max == 'true'
        run: |
          echo "Maximum iterations (5) reached for failure-fix agent. Manual intervention required."
          echo "made_changes=false" >> $GITHUB_OUTPUT
          exit 0

      - name: Set Docker user environment
        if: steps.iteration.outputs.exceeded_max != 'true'
        run: |
          echo "USER_ID=$(id -u)" >> $GITHUB_ENV
          echo "GROUP_ID=$(id -g)" >> $GITHUB_ENV

      - name: Run agent failure handler
        id: agent-fix
        if: steps.iteration.outputs.exceeded_max != 'true'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          ITERATION_COUNT: ${{ steps.iteration.outputs.iteration_count }}
        run: |
          if ! command -v automation-cli &>/dev/null; then
            echo "::warning::automation-cli not found on PATH - skipping failure handler"
            echo "made_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Running agent failure handler..."
          automation-cli review failure \
            "$PR_NUMBER" \
            "$BRANCH_NAME" \
            "$ITERATION_COUNT" \
            "5" \
            "format,lint,test"

  # -- PR Status Summary ---------------------------------------------------
  pr-status:
    name: PR Status Summary
    needs: [ci, claude-security-review, claude-quality-review, openrouter-review, agent-review-response, agent-failure-handler]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Generate status summary
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ needs.ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Claude Security Review | ${{ needs.claude-security-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Claude Quality Review | ${{ needs.claude-quality-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenRouter Review | ${{ needs.openrouter-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Review Response | ${{ needs.agent-review-response.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failure Handler | ${{ needs.agent-failure-handler.result }} |" >> $GITHUB_STEP_SUMMARY

          # CI failure is blocking; reviews are advisory
          if [[ "${{ needs.ci.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI failed - please review the logs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR validation completed successfully" >> $GITHUB_STEP_SUMMARY
