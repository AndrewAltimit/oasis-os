name: Setup PSP SDK
description: Creates rust-std-src symlinks for the PSP crates built in CI

runs:
  using: composite
  steps:
    - name: Setup PSP SDK symlinks
      shell: bash
      run: |
        # rust-std-src is gitignored; recreate the symlink for the self-hosted
        # runner. `cargo psp` (RUST_PSP_BUILD_STD=1) looks for rust-std-src/ in
        # the directory it is invoked from, so every PSP crate CI builds needs
        # its own link -- not just oasis-backend-psp.
        RUST_PSP_DIR="${RUST_PSP_DIR:-$HOME/Documents/repos/rust-psp}"
        if [ ! -d "$RUST_PSP_DIR/rust-std-src" ]; then
          echo "::error::rust-std-src not found at $RUST_PSP_DIR/rust-std-src"
          exit 1
        fi
        for crate in oasis-backend-psp oasis-plugin-psp oasis-recovery-psp; do
          link="crates/$crate/rust-std-src"
          if [ ! -e "$link" ]; then
            ln -sfn "$RUST_PSP_DIR/rust-std-src" "$link"
            echo "Linked $link -> $RUST_PSP_DIR/rust-std-src"
          fi
        done
