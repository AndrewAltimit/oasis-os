name: Setup PSP SDK
description: Creates rust-std-src symlink for PSP backend builds

runs:
  using: composite
  steps:
    - name: Setup PSP SDK symlink
      shell: bash
      run: |
        # rust-std-src is gitignored; recreate symlink for self-hosted runner.
        if [ ! -e "crates/oasis-backend-psp/rust-std-src" ]; then
          RUST_PSP_DIR="${RUST_PSP_DIR:-$HOME/Documents/repos/rust-psp}"
          if [ -d "$RUST_PSP_DIR/rust-std-src" ]; then
            ln -sf "$RUST_PSP_DIR/rust-std-src" crates/oasis-backend-psp/rust-std-src
            echo "Linked rust-std-src from $RUST_PSP_DIR"
          else
            echo "::error::rust-std-src not found at $RUST_PSP_DIR/rust-std-src"
            exit 1
          fi
        fi
