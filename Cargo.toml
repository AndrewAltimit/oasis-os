[workspace]
resolver = "2"
members = [
    "crates/oasis-types",
    "crates/oasis-vfs",
    "crates/oasis-platform",
    "crates/oasis-sdi",
    "crates/oasis-net",
    "crates/oasis-audio",
    "crates/oasis-ui",
    "crates/oasis-wm",
    "crates/oasis-skin",
    "crates/oasis-terminal",
    "crates/oasis-browser",
    "crates/oasis-js",
    "crates/oasis-app-core",
    "crates/oasis-app-games",
    "crates/oasis-app-paint",
    "crates/oasis-app-text-editor",
    "crates/oasis-app-calculator",
    "crates/oasis-app-media",
    "crates/oasis-app-tv-guide",
    "crates/oasis-app-radio",
    "crates/oasis-app-settings",
    "crates/oasis-app-file-manager",
    "crates/oasis-app-browser",
    "crates/oasis-app-network",
    "crates/oasis-app-package-manager",
    "crates/oasis-app-system-monitor",
    "crates/oasis-vector",
    "crates/oasis-shader",
    "crates/oasis-core",
    "crates/oasis-backend-sdl",
    "crates/oasis-backend-ue5",
    "crates/oasis-backend-wasm",
    "crates/oasis-ffi",
    "crates/oasis-app",
    "crates/oasis-video",
    "crates/oasis-rasterize",
    "crates/oasis-i18n",
    "crates/oasis-test-backend",
    "crates/oasis-usb-host",
]
# PSP crate excluded from workspace -- it requires mipsel-sony-psp target
# and the rust-psp SDK (github.com/AndrewAltimit/rust-psp). Build separately with cargo-psp:
#   cd crates/oasis-backend-psp && cargo psp --release
exclude = [
    "crates/oasis-backend-psp",
]

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT OR Unlicense"
repository = "https://github.com/AndrewAltimit/oasis-os"
authors = ["AndrewAltimit"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ignored = "0.1"
toml = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Graphics (desktop / Pi)
sdl3 = { version = "0.17", features = ["build-from-source"] }

# GPU shader rendering
glow = "0.16"

# Image encoding/decoding
png = "0.17"
jpeg-decoder = "0.3"
gif = { version = "0.14", default-features = false, features = ["std"] }

# TLS (desktop -- feature-gated in oasis-core)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0"
rustls-pki-types = "1"

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement",
    "HtmlIFrameElement", "HtmlElement", "CssStyleDeclaration",
    "CanvasRenderingContext2d", "CanvasGradient", "ImageData", "DomRect",
    "KeyboardEvent", "MouseEvent", "WheelEvent", "FocusEvent",
    "TouchEvent", "Touch", "TouchList",
    "EventTarget",
    "AudioContext", "AudioBuffer", "AudioBufferSourceNode",
    "GainNode", "AudioParam", "AudioDestinationNode",
    "BaseAudioContext",
    "console",
    # Fetch API (for Internet Archive streaming)
    "Request", "RequestInit", "Response", "Headers",
    "ReadableStream", "ReadableStreamDefaultReader",
    # MediaSource Extensions (streaming audio playback)
    "MediaSource", "SourceBuffer", "SourceBufferList",
    # Audio element (streaming playback target)
    "HtmlAudioElement", "HtmlMediaElement", "MediaSourceReadyState",
    # Video element (in-canvas TV Guide playback)
    "HtmlVideoElement",
    # Image element (YouTube embed thumbnail loader)
    "HtmlImageElement",
    # URL (object URLs for MSE)
    "Url",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Monotonic time that works on both native and wasm32-unknown-unknown.
# `std::time::Instant::now()` aborts in the browser — `web_time::Instant`
# is a drop-in replacement that delegates to `performance.now()` there
# and to `std::time::Instant` everywhere else.
web-time = "1"

# Compression
flate2 = "1"
brotli = { version = "7", default-features = false, features = ["std"] }

# Parallelism
rayon = "1.10"

# Fast hashing
rustc-hash = "2.1"

# Font rendering (TTF/OTF parsing + rasterization)
fontdue = "0.9"

# Audio decoding
rmp3 = { version = "0.3", default-features = false, features = ["simd"] }

# JavaScript engine
rquickjs = { version = "0.11", default-features = false, features = ["rust-alloc"] }

# Internal crates
oasis-types = { path = "crates/oasis-types" }
oasis-vfs = { path = "crates/oasis-vfs" }
oasis-platform = { path = "crates/oasis-platform" }
oasis-sdi = { path = "crates/oasis-sdi" }
oasis-net = { path = "crates/oasis-net" }
oasis-audio = { path = "crates/oasis-audio" }
oasis-ui = { path = "crates/oasis-ui" }
oasis-wm = { path = "crates/oasis-wm" }
oasis-skin = { path = "crates/oasis-skin" }
oasis-terminal = { path = "crates/oasis-terminal" }
oasis-browser = { path = "crates/oasis-browser" }
oasis-js = { path = "crates/oasis-js" }
oasis-app-core = { path = "crates/oasis-app-core" }
oasis-app-games = { path = "crates/oasis-app-games" }
oasis-app-paint = { path = "crates/oasis-app-paint" }
oasis-app-text-editor = { path = "crates/oasis-app-text-editor" }
oasis-app-calculator = { path = "crates/oasis-app-calculator" }
oasis-app-media = { path = "crates/oasis-app-media" }
oasis-app-tv-guide = { path = "crates/oasis-app-tv-guide" }
oasis-app-radio = { path = "crates/oasis-app-radio" }
oasis-app-settings = { path = "crates/oasis-app-settings" }
oasis-app-file-manager = { path = "crates/oasis-app-file-manager" }
oasis-app-browser = { path = "crates/oasis-app-browser" }
oasis-app-network = { path = "crates/oasis-app-network" }
oasis-app-package-manager = { path = "crates/oasis-app-package-manager" }
oasis-app-system-monitor = { path = "crates/oasis-app-system-monitor" }
oasis-core = { path = "crates/oasis-core", default-features = false }
oasis-vector = { path = "crates/oasis-vector" }
oasis-shader = { path = "crates/oasis-shader", default-features = false }
oasis-rasterize = { path = "crates/oasis-rasterize" }
oasis-i18n = { path = "crates/oasis-i18n" }
oasis-test-backend = { path = "crates/oasis-test-backend" }
oasis-backend-ue5 = { path = "crates/oasis-backend-ue5" }
oasis-backend-wasm = { path = "crates/oasis-backend-wasm" }
oasis-video = { path = "crates/oasis-video", default-features = false }

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.asan]
inherits = "dev"
opt-level = 1
debug = true
