# cargo-nextest configuration (used by the CI Test step).
#
# nextest runs every test in its own process and schedules tests from all
# binaries on one pool, so the slow oasis-app e2e suites overlap instead of
# running back to back as they do under `cargo test`.
#
# Doc-tests are not supported by nextest; CI runs them separately with
# `cargo test --workspace --doc`.

[profile.default]
# Report tests running longer than 60s; kill any test still running after
# 5 periods (5 min) so a hung test fails fast instead of eating the whole
# step timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Run everything and report all failures, not just the first one.
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

# The oasis-app integration suites each boot the whole shell in a debug
# build, and several loop over every skin. Unthrottled, dozens of them
# share the pool at once and the every-skin tests have been killed at the
# 5-minute guard while unrelated wall-clock assertions stretched 2-10x.
# Cap how many run together and give them a longer hang guard; the Test
# step's own timeout still bounds the whole run. Overrides in the default
# profile also apply to the ci profile.
[test-groups]
oasis-app-e2e = { max-threads = 8 }

[[profile.default.overrides]]
filter = 'package(oasis-app) & kind(test)'
test-group = 'oasis-app-e2e'
slow-timeout = { period = "60s", terminate-after = 10 }

