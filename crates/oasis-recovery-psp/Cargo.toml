# Standalone crate -- excluded from the oasis_os workspace.
#
# Minimal PSP recovery EBOOT with WiFi TCP file server.
# Replaces ARK-4's recovery menu with a network-enabled version
# that accepts remote file uploads for unbricking.
#
# Build:  cd crates/oasis-recovery-psp && RUST_PSP_BUILD_STD=1 cargo psp --release
# Deploy: cp target/.../EBOOT.PBP ms0:/PSP/SAVEDATA/ARK_01234/RECOVERY.PBP
# Trigger: Hold R-trigger during PSP boot to enter recovery mode

[workspace]

[package]
name = "oasis-recovery-psp"
description = "PSP network recovery EBOOT: WiFi TCP file server for unbricking"
version = "1.6.0"
edition = "2024"
license = "MIT"

[dependencies]
psp = { git = "https://github.com/AndrewAltimit/rust-psp", rev = "e4cc06f6fa50fa45dc3ae8b332e8a2b67625f588", features = ["std"] }
# The PSK challenge-response (src/auth.rs): `verify_auth_line` is the exact
# check the EBOOT command server and the desktop remote terminal run, and
# oasis-types' SHA-256 condenses the nonces. Both are pure Rust with no
# platform code, so they cost the recovery EBOOT only what LTO keeps.
oasis-net = { path = "../oasis-net" }
oasis-types = { path = "../oasis-types" }

# No `[patch.crates-io] unicode-width`: nothing in the graph uses it (see
# crates/oasis-backend-psp/Cargo.toml for the workaround if that changes).

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
