[package]
name = "oasis-core"
description = "Platform-agnostic core framework for OASIS_OS: scene graph, backend traits, input, config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-core"

# Feature flags:
# - tls-rustls: Propagates the tls-rustls feature to oasis-net, enabling TLS 1.3
#   support via rustls for the SDL desktop backend. The PSP backend uses embedded-tls
#   instead (pure Rust, no C/asm, works on mipsel-sony-psp).
[features]
default = ["tls-rustls"]
tls-rustls = ["oasis-net/tls-rustls"]
javascript = ["oasis-browser/javascript"]
wasm-youtube = []
test-data = []

[dependencies]
oasis-app-core = { workspace = true }
oasis-app-games = { workspace = true }
oasis-app-paint = { workspace = true }
oasis-app-text-editor = { workspace = true }
oasis-app-calculator = { workspace = true }
oasis-app-media = { workspace = true }
oasis-app-tv-guide = { workspace = true }
oasis-app-radio = { workspace = true }
oasis-app-settings = { workspace = true }
oasis-app-file-manager = { workspace = true }
oasis-app-browser = { workspace = true }
oasis-app-network = { workspace = true }
oasis-app-package-manager = { workspace = true }
oasis-app-system-monitor = { workspace = true }
oasis-types = { workspace = true }
oasis-vfs = { workspace = true }
oasis-platform = { workspace = true }
oasis-sdi = { workspace = true }
oasis-net = { workspace = true }
oasis-audio = { workspace = true }
oasis-ui = { workspace = true }
oasis-wm = { workspace = true }
oasis-skin = { workspace = true }
oasis-vector = { workspace = true }
oasis-terminal = { workspace = true }
oasis-browser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
oasis-test-backend = { workspace = true }
tempfile = "3"
proptest.workspace = true
criterion = { workspace = true }

[[bench]]
name = "dashboard_frame"
harness = false

[lints]
workspace = true
