[package]
name = "oasis-core"
description = "OASIS_OS coordination layer: dashboard, shell chrome, app runtime, plugins, scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-core"

# Feature flags:
# - tls-rustls: Propagates the tls-rustls feature to oasis-net, enabling TLS 1.3
#   support via rustls for the SDL desktop backend. The PSP backend uses embedded-tls
#   instead (pure Rust, no C/asm, works on mipsel-sony-psp).
[features]
default = ["tls-rustls", "skin-ttf"]
tls-rustls = ["oasis-net/tls-rustls"]
# Skin-font (fontdue) validation in oasis-skin. In default features so the
# desktop `skin lint` catches unparseable fonts; the PSP build opts out via
# default-features = false and never compiles fontdue.
skin-ttf = ["oasis-skin/ttf"]
javascript = ["oasis-browser/javascript"]
test-data = []

[dependencies]
# The App trait and shared app helpers only: the concrete apps live in the
# oasis-app-* crates, bundled for hosts by oasis-apps.
oasis-app-core = { workspace = true }
oasis-types = { workspace = true }
oasis-vfs = { workspace = true }
oasis-platform = { workspace = true }
oasis-sdi = { workspace = true }
# `vfs`: the FTP server behind the `ftp` / `push` / `pull` commands.
oasis-net = { workspace = true, features = ["vfs"] }
oasis-audio = { workspace = true }
oasis-ui = { workspace = true }
oasis-wm = { workspace = true }
oasis-skin = { workspace = true, features = ["serialize"] }  # `skin export`
oasis-vector = { workspace = true }
oasis-terminal = { workspace = true }
oasis-browser = { workspace = true }
oasis-http = { workspace = true }
oasis-i18n = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
log = { workspace = true }

[dev-dependencies]
oasis-test-backend = { workspace = true }
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "dashboard_frame"
harness = false

[[bench]]
name = "terminal_scrollback"
harness = false

[lints]
workspace = true
