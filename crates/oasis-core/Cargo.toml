[package]
name = "oasis-core"
description = "Platform-agnostic core framework for OASIS_OS: scene graph, backend traits, input, config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-core"

# Feature flags:
# - tls-rustls: Propagates the tls-rustls feature to oasis-net, enabling TLS 1.3
#   support via rustls for the SDL desktop backend. The PSP backend uses embedded-tls
#   instead (pure Rust, no C/asm, works on mipsel-sony-psp).
[features]
default = ["tls-rustls"]
tls-rustls = ["oasis-net/tls-rustls"]
javascript = ["oasis-browser/javascript"]
test-data = []

[dependencies]
oasis-types = { workspace = true }
oasis-vfs = { workspace = true }
oasis-platform = { workspace = true }
oasis-sdi = { workspace = true }
oasis-net = { workspace = true }
oasis-audio = { workspace = true }
oasis-ui = { workspace = true }
oasis-wm = { workspace = true }
oasis-skin = { workspace = true }
oasis-terminal = { workspace = true }
oasis-browser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
