[package]
name = "oasis-shader"
description = "GPU shader background renderer for OASIS_OS (Shadertoy-style fragment shaders)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# GPU path: `glow` (OpenGL, or WebGL2 through a host-created
# `glow::Context`); the CPU renderer is always built.
gl-native = ["glow"]
# Multi-threaded software shading (rayon). Desktop-only: do not enable
# for the WASM or PSP targets (single-threaded; PSP grids are tiny).
parallel = ["dep:rayon"]

[dependencies]
glow = { workspace = true, optional = true }
log = { workspace = true }
oasis-types = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "shader_render"
harness = false

[lints]
workspace = true
