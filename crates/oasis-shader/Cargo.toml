[package]
name = "oasis-shader"
description = "GPU shader background renderer for OASIS_OS (Shadertoy-style fragment shaders)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
gl-native = ["glow"]
gl-web = ["glow", "web-sys", "wasm-bindgen"]
software = []
# Multi-threaded software shading (rayon). Desktop-only: do not enable
# for the WASM or PSP targets (single-threaded; PSP grids are tiny).
parallel = ["dep:rayon"]

[dependencies]
glow = { version = "0.16", optional = true }
log = { workspace = true }
oasis-types = { workspace = true }
rayon = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "WebGl2RenderingContext",
    "HtmlCanvasElement",
    "Document",
    "Window",
], optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "shader_render"
harness = false

[lints]
workspace = true
