[package]
name = "oasis-app"
description = "Desktop entry point for OASIS_OS"
default-run = "oasis-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-app"

[[bin]]
name = "oasis-app"
path = "src/main.rs"

[[bin]]
name = "oasis-screenshot"
path = "src/screenshot.rs"

[[bin]]
name = "screenshot-tests"
path = "src/screenshot_tests.rs"

[[bin]]
name = "e2e-tests"
path = "src/e2e_tests.rs"

[features]
default = ["javascript", "video-decode"]
javascript = ["oasis-core/javascript"]
video-decode = ["dep:oasis-video", "oasis-video/h264"]

[dependencies]
oasis-core = { workspace = true }
oasis-audio = { workspace = true }
oasis-backend-sdl = { path = "../oasis-backend-sdl" }
oasis-video = { workspace = true, optional = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
