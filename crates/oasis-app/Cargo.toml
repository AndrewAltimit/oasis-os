[package]
name = "oasis-app"
description = "Desktop entry point for OASIS_OS"
default-run = "oasis-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-app"

[[bin]]
name = "oasis-app"
path = "src/main.rs"

[[bin]]
name = "oasis-screenshot"
path = "src/screenshot.rs"

[[bin]]
name = "screenshot-tests"
path = "src/screenshot_tests.rs"

[[bin]]
name = "e2e-tests"
path = "src/e2e_tests.rs"

[features]
default = ["javascript", "video-decode-ffmpeg"]
javascript = ["oasis-core/javascript"]
# Internal: oasis-video is available. Activated by video-decode or video-decode-ffmpeg.
_video = ["dep:oasis-video"]
# Software decode via openh264 (Baseline profile only). Fallback for
# environments without ffmpeg dev libraries (e.g. embedded, PSP).
# Build: cargo build -p oasis-app --no-default-features --features video-decode,javascript
video-decode = ["_video", "oasis-video/h264"]
# Full decode via system ffmpeg (Main/High profile, SIMD-optimized).
# Default for desktop — requires libavcodec-dev etc. on the system.
video-decode-ffmpeg = ["_video", "oasis-video/ffmpeg"]
# Dev-only: poll the active external skin directory each second and
# hot-reload it when files change on disk (see src/hot_reload.rs).
# Run: cargo run -p oasis-app --features skin-dev -- <skin>
skin-dev = []
# Optional: host an MCP (Model Context Protocol) control server on loopback
# so a local agent can drive the shell. Off by default; also requires runtime
# opt-in (OASIS_MCP=1 or the `mcp-server start` command). See docs/mcp-server.md.
mcp = ["dep:oasis-mcp", "dep:serde_json"]

[dependencies]
oasis-core = { workspace = true, features = ["tls-rustls"] }
oasis-mcp = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
oasis-app-settings = { workspace = true }
oasis-app-media = { workspace = true }
oasis-audio = { workspace = true }
oasis-backend-sdl = { path = "../oasis-backend-sdl" }
oasis-shader = { workspace = true, features = ["gl-native"] }
oasis-video = { workspace = true, optional = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
