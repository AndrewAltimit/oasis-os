[package]
name = "oasis-audio"
description = "Audio subsystem: playlist management, playback state, manager for OASIS_OS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-audio"

[dependencies]
oasis-types = { workspace = true }
oasis-vfs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }

# Ogg Vorbis decoding (pure Rust via symphonia)
symphonia = { version = "0.5", default-features = false, features = [
    "ogg",     # Ogg container demuxer
    "vorbis",  # Vorbis codec decoder
] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
