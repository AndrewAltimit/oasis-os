[package]
name = "oasis-audio"
description = "Audio subsystem for OASIS_OS: music playlist and playback state, internet radio, SFX, WAV/Ogg decode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-audio"

[dependencies]
oasis-types = { workspace = true }
oasis-vfs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }

# Ogg Vorbis decoding (pure Rust via symphonia)
symphonia = { version = "0.5", default-features = false, features = [
    "ogg",     # Ogg container demuxer
    "vorbis",  # Vorbis codec decoder
] }

[dev-dependencies]
proptest.workspace = true
# Real non-blocking TCP sockets for the radio loopback tests.
oasis-net = { workspace = true }

[lints]
workspace = true
