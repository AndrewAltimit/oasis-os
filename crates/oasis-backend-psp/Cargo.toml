# Standalone crate -- excluded from the oasis_os workspace because it
# requires the mipsel-sony-psp target and the rust-psp SDK.
# Build with: RUST_PSP_BUILD_STD=1 cargo +nightly psp --release

[workspace]

[package]
name = "oasis-backend-psp"
description = "PSP backend for OASIS_OS: hardware-accelerated GU rendering, controller input"
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/oasis-os"
authors = ["AndrewAltimit"]

# Feature flags for PSP hardware capabilities:
#
# - kernel-mode: Meta-feature that enables all stable kernel sub-features.
#   Bundles kernel-volatile, kernel-me-clock, and kernel-me. Intentionally
#   excludes kernel-exception which is broken on PSP-3000 + 6.20 PRO-C.
#   All kernel features gate psp/kernel for kernel-mode syscall access.
#
# - kernel-exception: Register a default exception handler via
#   sceKernelRegisterDefaultExceptionHandler. Broken on PSP-3000 + 6.20 PRO-C --
#   excluded from kernel-mode for safety.
#
# - kernel-volatile: Access volatile memory (extra 4MB) via
#   sceKernelVolatileMemTryLock. Useful for large texture/audio buffers.
#
# - kernel-me-clock: Read Media Engine clock frequency via
#   scePowerGetMeClockFrequency. Informational only.
#
# - kernel-me: Enable Media Engine coprocessor offloading. Provides the
#   `me test` command for benchmarking. The ME core has no syscalls, no cached
#   memory, and no heap -- pure integer/float math only.
[features]
default = []
kernel-mode = ["psp/kernel", "kernel-volatile", "kernel-me-clock", "kernel-me"]
kernel-exception = ["psp/kernel"]
kernel-volatile = ["psp/kernel"]
kernel-me-clock = ["psp/kernel"]
kernel-me = ["psp/kernel"]

[dependencies]
# Pinned to specific commit for reproducible builds.
psp = { git = "https://github.com/AndrewAltimit/rust-psp", rev = "4370415", features = ["std"] }
oasis-core = { path = "../oasis-core", default-features = false }
oasis-video = { path = "../oasis-video", default-features = false, features = ["no-std-demux"] }
libm = "0.2"

# TLS for HTTPS/Gemini (pure Rust, no C/asm, works on mipsel-sony-psp)
embedded-tls = { version = "0.18", default-features = false, features = ["std", "alloc", "log"] }
embedded-io = { version = "0.7", features = ["std"] }
rand_core = "0.6"
webpki = { version = "0.22", default-features = false, features = ["std"] }

# getrandom does not support mipsel-sony-psp natively. We provide custom
# backends that use the PSP's hardware MT19937 PRNG via sceKernelUtils.
# v0.2: custom backend via Cargo feature + register_custom_getrandom! macro.
# v0.3: custom backend via --cfg getrandom_backend="custom" in .cargo/config.toml.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom = "0.3"

# unicode-width fork: the upstream crate panics on mipsel-sony-psp due to
# a lookup table issue. This fork patches the panic for the MIPS target.
[patch.crates-io]
unicode-width = { git = "https://git.sr.ht/~sajattack/unicode-width", rev = "114ac47" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
# Do NOT set strip = true -- it conflicts with --emit-relocs needed by prxgen.

[profile.dev]
opt-level = 1
