[package]
name = "oasis-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OASIS_OS C-ABI FFI boundary for UE5 and external integrations"
documentation = "https://docs.rs/oasis-ffi"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Internal: oasis-video is available.
_video = ["dep:oasis-video"]
video-decode = ["_video", "oasis-video/h264"]
# Use ffmpeg for video decode (statically linked, no runtime deps).
video-decode-ffmpeg = ["_video", "oasis-video/ffmpeg"]

[dependencies]
oasis-core.workspace = true
oasis-backend-ue5.workspace = true
oasis-shader = { workspace = true, features = ["software"] }
oasis-video = { workspace = true, optional = true }
log.workspace = true
env_logger.workspace = true

[lints]
workspace = true
