[package]
name = "oasis-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OASIS_OS C-ABI FFI boundary for UE5 and external integrations"
documentation = "https://docs.rs/oasis-ffi"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
video-decode = ["dep:oasis-video", "oasis-video/h264"]

[dependencies]
oasis-core.workspace = true
oasis-backend-ue5.workspace = true
oasis-video = { workspace = true, optional = true }
log.workspace = true
env_logger.workspace = true

[lints]
workspace = true
