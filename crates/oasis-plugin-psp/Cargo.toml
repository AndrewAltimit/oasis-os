# Standalone crate -- excluded from the oasis_os workspace because it
# requires the mipsel-sony-psp target and the rust-psp SDK.
#
# Builds a kernel-mode PRX plugin that stays resident alongside games,
# providing in-game overlay UI and background MP3 playback.
#
# Build with: RUST_PSP_BUILD_STD=1 cargo psp --release

[workspace]

[package]
name = "oasis-plugin-psp"
description = "PSP overlay plugin PRX: in-game overlay + background music for OASIS_OS"
version = "1.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/oasis-os"
authors = ["AndrewAltimit"]

[dependencies]
# Pinned to specific commit for reproducible builds.
psp = { git = "https://github.com/AndrewAltimit/rust-psp", rev = "e4cc06f6fa50fa45dc3ae8b332e8a2b67625f588", features = ["kernel"] }

# No `[patch.crates-io] unicode-width`: nothing in the graph uses it (see
# crates/oasis-backend-psp/Cargo.toml for the workaround if that changes).

[profile.release]
opt-level = "z"        # minimize size (CI budget: 192 KiB stripped, see docs/psp-plugin.md)
lto = true
codegen-units = 1
# Kept on purpose (measured: "abort" saves only ~10 KB of the stripped PRX;
# libunwind is linked either way). With unwind, module_start's catch_unwind
# catches a panic in psp_main, and a panic on one of the raw kernel threads
# ends in psp's print-and-exit-thread path rather than an abort trap under a
# running game.
panic = "unwind"
# Do NOT set strip = true -- it conflicts with --emit-relocs needed by prxgen.
