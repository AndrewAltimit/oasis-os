[package]
name = "oasis-backend-wasm"
description = "WebAssembly backend for OASIS_OS: Canvas 2D rendering, DOM input, Web Audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["wasm-youtube"]
wasm-youtube = ["oasis-core/wasm-youtube"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Note: `javascript` feature intentionally omitted — rquickjs-sys requires clang
# to cross-compile QuickJS C code for wasm32-unknown-unknown.
#
# Redundant transitive deps removed: oasis-vfs, oasis-sdi, oasis-terminal,
# oasis-browser, oasis-net, oasis-ui, serde, serde_json, toml — all available
# through oasis-core re-exports and not directly imported in this crate.
oasis-core = { workspace = true, default-features = false }
# Shared software rasterization: GlyphCacheKey, SoftwareBuffer
oasis-rasterize = { workspace = true }
# Direct imports: oasis_types::{backend, error, input, geometry} in renderer, input, network, audio, video
oasis-types = { workspace = true }
# Direct import: oasis_skin::resolve_skin in lib.rs
oasis-skin = { workspace = true }
# Direct import: oasis_platform::{PowerService, TimeService, ...} in platform.rs
oasis-platform = { workspace = true }
# Direct imports: oasis_audio::{radio, RadioManager, RADIO_REQUEST_PATH} in archive.rs, lib.rs
oasis-audio = { workspace = true }
# Direct import: oasis_wm::DesktopManager in lib.rs
oasis-wm = { workspace = true }
# Direct import: oasis_shader::{ShaderParams, software::SoftwareShaderRenderer} in shader_bridge.rs
oasis-shader = { workspace = true, features = ["software"] }
# Direct usage: log::info!, log::warn! in shader_bridge.rs, lib.rs
log = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt: Rust LTO handles optimization; avoids version-mismatch
# errors with bulk-memory and nontrapping-float-to-int instructions.
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
