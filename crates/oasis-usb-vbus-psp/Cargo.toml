# Standalone kernel-mode crate -- excluded from the oasis_os workspace.
# Requires mipsel-sony-psp target, rust-psp SDK, and custom firmware.
# Build with: RUST_PSP_BUILD_STD=1 cargo psp --release

[workspace]

[package]
name = "oasis-usb-vbus-psp"
description = "PSP USB VBUS power output — GPIO discovery, Syscon commands, host mode init"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AndrewAltimit/oasis-os"
authors = ["AndrewAltimit"]

[dependencies]
psp = { git = "https://github.com/AndrewAltimit/rust-psp", rev = "d833e94", features = ["kernel"] }

# Standalone crates have their own `[workspace]` and inherit nothing from the
# parent. Mirror the parent policy so unsafe-block discipline tracks here too.
[lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 4
panic = "abort"
