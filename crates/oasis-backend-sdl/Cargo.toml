[package]
name = "oasis-backend-sdl"
description = "SDL3 rendering and input backend for OASIS_OS (desktop and Raspberry Pi)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-backend-sdl"

[dependencies]
oasis-core = { workspace = true, features = ["tls-rustls", "javascript"] }
oasis-audio = { workspace = true }
oasis-types = { workspace = true }
oasis-rasterize = { workspace = true, features = ["ttf"] }
oasis-shader = { workspace = true, features = ["software", "parallel"] }
sdl3 = { workspace = true }
rmp3 = { workspace = true }
log = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
# Backend conformance suite (tests/backend_parity.rs): the shared scenarios
# and the software framebuffer SDL output is compared against.
oasis-test-backend = { workspace = true }
oasis-backend-ue5 = { workspace = true }
png = { workspace = true }

[lints]
workspace = true

# Repo-level example (lives in /examples so all examples sit together).
[[example]]
name = "minimal_sdl"
path = "../../examples/minimal_sdl.rs"
