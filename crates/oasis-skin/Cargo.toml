[package]
name = "oasis-skin"
description = "Skin system for OASIS_OS: data-driven TOML skins, themes, effects, active theme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-skin"

[features]
# Validate `[typography] font` assets by actually parsing them with fontdue.
# Off by default so the PSP build (oasis-core with default-features = false)
# never compiles fontdue; without it validation still checks existence and
# size budget.
ttf = ["dep:fontdue"]

[dependencies]
oasis-types = { workspace = true }
fontdue = { workspace = true, optional = true }
oasis-sdi = { workspace = true }
oasis-ui = { workspace = true }
oasis-vector = { workspace = true }
oasis-wm = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
png = { workspace = true }

[dev-dependencies]
oasis-test-backend = { workspace = true }
tempfile = "3"

[lints]
workspace = true
