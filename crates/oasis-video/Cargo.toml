[package]
name = "oasis-video"
description = "Software MP4/H.264+AAC video decode pipeline for OASIS_OS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# All features are additive (see the crate docs). None is on by default:
# the PSP build only wants `demux-lite`, desktop/UE5 pick `h264` or `ffmpeg`.
default = []
# Dependency-free MP4 parser (`demux_lite`): PSP, seek-point lookup, fuzzing.
demux-lite = []
# symphonia MP4 demuxer + AAC-LC decoder (`demux`, `aac`) and the
# symphonia-backed `SoftwareVideoDecoder` (audio-only without `h264`).
symphonia = ["dep:symphonia", "demux-lite"]
# H.264 decoding via openh264 (Cisco C source compiled via cc) on top of
# the symphonia backend. Requires a C++ compiler.
h264 = ["symphonia", "dep:openh264"]
# Full decode via statically-linked ffmpeg (desktop, UE5, shipping).
# Replaces symphonia (demux/AAC) and openh264 (H.264) as the
# `SoftwareVideoDecoder` backend; when both this and `h264` are enabled,
# ffmpeg wins and the symphonia modules stay available as libraries.
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
log = "0.4"
thiserror = { workspace = true }

# MP4 demuxing + AAC decoding (pure Rust)
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "isomp4",  # MP4/ISO BMFF demuxer
    "aac",     # AAC-LC decoder
] }

# H.264 decoding (Cisco OpenH264 C source compiled via cc)
openh264 = { version = "0.9", optional = true }

# FFmpeg via Rust bindings — links against system ffmpeg (pkg-config).
# For static builds (CI/shipping), add "build" + "static" features.
# Only H.264 + AAC codecs and MP4 demuxer are needed.
ffmpeg-next = { version = "7", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }

[[bin]]
name = "video-memprofile"
path = "src/bin/video_memprofile.rs"
required-features = ["h264"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest.workspace = true

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
