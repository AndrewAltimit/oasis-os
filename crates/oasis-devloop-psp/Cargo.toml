# Standalone crate -- excluded from the oasis_os workspace.
#
# Minimal kernel-mode PRX for remote PSP development automation.
# WiFi TCP server on port 9293 for commands: screenshot, reboot, launch.
#
# Build: cd crates/oasis-devloop-psp && RUST_PSP_BUILD_STD=1 cargo psp --release
# Deploy: cp target/.../oasis-devloop-psp.prx ms0:/seplugins/devloop.prx
# Enable: add "xmb, ms0:/seplugins/devloop.prx, on" to PLUGINS.TXT

[workspace]

[package]
name = "oasis-devloop-psp"
description = "PSP remote dev automation PRX: WiFi TCP command server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
psp = { git = "https://github.com/AndrewAltimit/rust-psp", rev = "e4cc06f6fa50fa45dc3ae8b332e8a2b67625f588", features = ["kernel"] }

# No `[patch.crates-io] unicode-width`: nothing in the graph uses it (see
# crates/oasis-backend-psp/Cargo.toml for the workaround if that changes).

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
