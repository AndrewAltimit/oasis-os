[package]
name = "oasis-backend-ue5"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OASIS_OS UE5 render target backend -- software RGBA framebuffer and FFI input"
documentation = "https://docs.rs/oasis-backend-ue5"

[dependencies]
oasis-types.workspace = true
oasis-rasterize.workspace = true
oasis-audio.workspace = true
log.workspace = true

[dev-dependencies]
# examples/headless_screenshot.rs drives a dashboard.
oasis-core.workspace = true
png.workspace = true
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "dense_frame"
harness = false

# Repo-level example (lives in /examples so all examples sit together).
[[example]]
name = "headless_screenshot"
path = "../../examples/headless_screenshot.rs"
