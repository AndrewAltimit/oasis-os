[package]
name = "oasis-browser"
description = "HTML/CSS/Gemini browser engine for OASIS_OS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/oasis-browser"

[features]
default = ["web-fonts", "canvas"]
javascript = ["dep:oasis-js", "oasis-css/scripting"]
canvas = []
web-fonts = ["dep:fontdue", "oasis-css/web-fonts"]
webp = ["dep:image"]
parallel-style = ["oasis-css/parallel-style"]
psp = ["oasis-http/psp"]

[dependencies]
oasis-types = { workspace = true }
oasis-html = { workspace = true }
oasis-css = { workspace = true }
oasis-http = { workspace = true }
oasis-vfs = { workspace = true }
oasis-net = { workspace = true }
oasis-skin = { workspace = true }
oasis-js = { workspace = true, optional = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
png = { workspace = true }
jpeg-decoder = { workspace = true }
gif = { workspace = true }
image = { version = "0.25", default-features = false, features = ["webp"], optional = true }
fontdue = { workspace = true, optional = true }
web-time = { workspace = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
oasis-test-backend = { workspace = true }
# `examples/triage.rs` fans pages out over rayon under `parallel-style`.
rayon = { workspace = true }
oasis-net = { workspace = true, features = ["tls-rustls"] }

[[bench]]
name = "layout_engine"
harness = false

[[bench]]
name = "paint"
harness = false

[lints]
workspace = true
