[package]
name = "oasis-js"
description = "JavaScript engine for OASIS_OS browser (QuickJS-NG via rquickjs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Ask rquickjs-sys to regenerate C bindings at build time via
# `bindgen` instead of using the vendored per-target files. Enabled by
# the PSP backend because `mipsel-sony-psp-std` isn't in the vendored
# set — see `crates/oasis-backend-psp/Cargo.toml`. Pulls in `libclang`
# at build time.
psp-bindgen = ["rquickjs/bindgen"]

[dependencies]
rquickjs = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
